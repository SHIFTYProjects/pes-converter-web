<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PES Embroidery Studio</title>
    <!-- Load Fabric.js for Drag/Drop/Text/Rotation capabilities -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background: #121212; color: #fff; margin: 0; padding: 20px; display: flex; gap: 20px; }
        #controls { width: 300px; background: #1e1e1e; padding: 20px; border-radius: 8px; display: flex; flex-direction: column; gap: 15px; }
        #canvas-container { flex-grow: 1; display: flex; justify-content: center; align-items: center; background: #2a2a2a; border-radius: 8px; padding: 20px; }
        .hoop-bounds { border: 2px dashed #00a8ff; background: #ffffff; }
        button, select, input { padding: 10px; background: #333; color: white; border: 1px solid #555; border-radius: 4px; cursor: pointer; }
        button:hover { background: #00a8ff; }
    </style>
</head>
<body>

    <div id="controls">
        <h2>PES Studio</h2>
        
        <!-- Hoop Selection -->
        <label>Hoop Size:</label>
        <select id="hoop-select">
            <option value="4x4">4" x 4" (100mm x 100mm)</option>
            <option value="5x7">5" x 7" (130mm x 180mm)</option>
            <option value="6x10">6" x 10" (160mm x 260mm)</option>
        </select>

        <!-- Artwork Upload -->
        <label>Add Artwork:</label>
        <input type="file" id="img-upload" accept="image/*">

        <!-- Text Engine Controls -->
        <label>Add Text:</label>
        <input type="text" id="text-input" placeholder="Enter text (e.g. SHIFTY)">
        <select id="font-select">
            <option value="Arial">Arial</option>
            <option value="Impact">Impact</option>
            <option value="Courier New">Courier New</option>
            <option value="Trebuchet MS">Trebuchet MS</option>
        </select>
        <button id="add-text-btn">Add Text Object</button>

        <!-- Color Management -->
        <label>Thread Color Palette:</label>
        <input type="color" id="thread-color" value="#00a8ff">
        <button id="apply-color-btn">Assign Color to Selected</button>

        <hr style="border-color: #444; width: 100%;">
        
        <button id="generate-pes-btn" style="background: #00a8ff; font-weight: bold;">Export PES File</button>
    </div>

    <div id="canvas-container">
        <!-- Interactive Fabric.js Canvas -->
        <div class="hoop-bounds" id="hoop-wrapper">
            <canvas id="embroidery-canvas"></canvas>
        </div>
    </div>

    <script>
        // Initialize Interactive Canvas
        const canvas = new fabric.Canvas('embroidery-canvas');
        
        // Define Hoop Dimensions (Pixels mapped to relative sizes)
        const hoopSizes = {
            '4x4': { width: 400, height: 400 },
            '5x7': { width: 500, height: 700 },
            '6x10': { width: 600, height: 1000 }
        };

        function setHoopSize(sizeKey) {
            const size = hoopSizes[sizeKey];
            canvas.setWidth(size.width);
            canvas.setHeight(size.height);
            document.getElementById('hoop-wrapper').style.width = size.width + 'px';
            document.getElementById('hoop-wrapper').style.height = size.height + 'px';
        }
        setHoopSize('4x4');

        document.getElementById('hoop-select').addEventListener('change', (e) => setHoopSize(e.target.value));

        // Add Uploaded Image (Draggable, Scalable, Rotatable)
        document.getElementById('img-upload').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(f) {
                fabric.Image.fromURL(f.target.result, function(img) {
                    img.scaleToWidth(200);
                    canvas.add(img);
                    canvas.setActiveObject(img);
                });
            };
            reader.readAsDataURL(file);
        });

        // Add Interactive Text
        document.getElementById('add-text-btn').addEventListener('click', () => {
            const textVal = document.getElementById('text-input').value || 'SHIFTY';
            const fontFamily = document.getElementById('font-select').value;
            const color = document.getElementById('thread-color').value;

            const text = new fabric.Text(textVal, {
                left: 100,
                top: 100,
                fontFamily: fontFamily,
                fill: color,
                fontSize: 40
            });
            canvas.add(text);
            canvas.setActiveObject(text);
        });

        // Color Assignee
        document.getElementById('apply-color-btn').addEventListener('click', () => {
            const activeObj = canvas.getActiveObject();
            if (activeObj) {
                const color = document.getElementById('thread-color').value;
                activeObj.set('fill', color);
                canvas.renderAll();
            }
        });

        // Consolidated Export Pipeline
        document.getElementById('generate-pes-btn').addEventListener('click', () => {
            const objects = canvas.getObjects();
            if (objects.length === 0) {
                alert('Add artwork or text to the canvas first.');
                return;
            }

            // Group Objects by Thread Color to eliminate redundant machine stops
            const colorBlocks = {};
            objects.forEach(obj => {
                const color = obj.fill || '#000000';
                if (!colorBlocks[color]) colorBlocks[color] = [];
                colorBlocks[color].push(obj);
            });

            console.log("Consolidated Color Blocks:", Object.keys(colorBlocks));
            alert(`Ready to digitize ${Object.keys(colorBlocks).length} distinct thread color block(s).`);
        });
    </script>
</body>
</html>
