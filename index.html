<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PES Embroidery Studio - Vector Tracing</title>
    <!-- Fabric.js for interactive canvas design -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
    <!-- ImageTracer.js for Raster-to-Vector conversion -->
    <script src="https://cdn.jsdelivr.net/npm/imagetracerjs@1.2.6/imagetracer_v1.2.6.js"></script>
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #121212; color: #e0e0e0; margin: 0; padding: 20px; display: flex; gap: 20px; height: 100vh; overflow: hidden; }
        
        /* Sidebar Controls */
        #sidebar { width: 390px; background: #1e1e1e; padding: 20px; border-radius: 8px; display: flex; flex-direction: column; gap: 14px; overflow-y: auto; max-height: calc(100vh - 40px); border: 1px solid #333; }
        h2 { margin: 0 0 2px 0; font-size: 1.3rem; color: #00a8ff; }
        h3 { margin: 10px 0 4px 0; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 1px; color: #888; border-bottom: 1px solid #333; padding-bottom: 4px; }
        
        .control-group { display: flex; flex-direction: column; gap: 6px; }
        .row { display: flex; gap: 8px; align-items: center; }
        .row > * { flex: 1; }

        label { font-size: 0.82rem; color: #aaa; }
        button, select, input[type="text"], input[type="number"], input[type="range"] { padding: 8px 10px; background: #2a2a2a; color: white; border: 1px solid #444; border-radius: 4px; font-size: 0.88rem; }
        button { cursor: pointer; background: #333; transition: 0.2s; font-weight: 600; }
        button:hover { background: #00a8ff; color: #fff; border-color: #00a8ff; }
        
        /* Swatches & Color Mapping Cards */
        .palette { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
        .swatch { width: 26px; height: 26px; border-radius: 50%; border: 2px solid #444; cursor: pointer; transition: 0.1s; position: relative; }
        .swatch:hover, .swatch.active { transform: scale(1.15); border-color: #00a8ff; }

        .color-map-list { display: flex; flex-direction: column; gap: 6px; max-height: 200px; overflow-y: auto; background: #161616; padding: 8px; border-radius: 6px; border: 1px solid #333; }
        .color-map-row { display: flex; align-items: center; justify-content: space-between; background: #222; padding: 6px 10px; border-radius: 4px; border: 1px solid #333; cursor: pointer; }
        .color-map-row.selected { border-color: #00a8ff; background: #2a2a2a; }
        .color-preview-pair { display: flex; align-items: center; gap: 8px; font-size: 0.8rem; }

        /* Workspace Area & Rulers */
        #workspace { flex-grow: 1; display: flex; flex-direction: column; background: #181818; border-radius: 8px; padding: 10px; border: 1px solid #333; position: relative; overflow: auto; }
        #canvas-area { position: relative; margin: auto; display: grid; grid-template-columns: 30px 1fr; grid-template-rows: 30px 1fr; }
        
        #ruler-top { grid-column: 2; grid-row: 1; background: #222; border-bottom: 1px solid #444; }
        #ruler-left { grid-column: 1; grid-row: 2; background: #222; border-right: 1px solid #444; }
        #ruler-corner { grid-column: 1; grid-row: 1; background: #1a1a1a; border-right: 1px solid #444; border-bottom: 1px solid #444; }
        
        #canvas-wrapper { grid-column: 2; grid-row: 2; position: relative; background: #ffffff; border: 2px dashed #00a8ff; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        #stitch-preview-canvas { position: absolute; top: 0; left: 0; pointer-events: none; display: none; z-index: 10; background: #1a1a1a; }
    </style>
</head>
<body>

    <!-- SIDEBAR CONTROL PANEL -->
    <div id="sidebar">
        <h2>PES Embroidery Studio</h2>

        <!-- HOOP CONFIGURATION -->
        <h3>1. Hoop & Orientation</h3>
        <div class="control-group">
            <label>Hoop Size Preset:</label>
            <select id="hoop-select">
                <option value="4x4">4" x 4" (100 x 100 mm)</option>
                <option value="5x7" selected>5" x 7" (130 x 180 mm)</option>
                <option value="6x10">6" x 10" (160 x 260 mm)</option>
                <option value="8x8">8" x 8" (200 x 200 mm)</option>
                <option value="8x12">8" x 12" (200 x 300 mm)</option>
                <option value="9.5x14">9.5" x 14" (240 x 360 mm)</option>
                <option value="custom">Custom Size...</option>
            </select>
        </div>

        <div id="custom-hoop-inputs" class="row" style="display: none;">
            <div>
                <label>Width (in):</label>
                <input type="number" id="custom-w" value="6" step="0.5" min="1">
            </div>
            <div>
                <label>Height (in):</label>
                <input type="number" id="custom-h" value="6" step="0.5" min="1">
            </div>
        </div>

        <div class="control-group">
            <label>Orientation:</label>
            <div class="row">
                <button id="orient-portrait" style="background:#00a8ff;">Portrait</button>
                <button id="orient-landscape">Landscape</button>
            </div>
        </div>

        <!-- ARTWORK & TEXT -->
        <h3>2. Import Graphic / Text</h3>
        <div class="control-group">
            <input type="file" id="img-upload" accept="image/*" style="display:none;">
            <button onclick="document.getElementById('img-upload').click()">Upload Image (PNG/JPG)</button>
        </div>
        <div class="control-group" style="margin-top: 4px;">
            <div class="row">
                <input type="text" id="text-input" placeholder="e.g. SHIFTY">
                <button id="add-text-btn">Add Text</button>
            </div>
            <select id="font-select">
                <option value="Arial">Arial</option>
                <option value="Impact">Impact</option>
                <option value="Courier New">Courier New</option>
                <option value="Trebuchet MS">Trebuchet MS</option>
                <option value="Georgia">Georgia</option>
            </select>
        </div>

        <!-- VECTORIZATION & BACKGROUND CLEANUP -->
        <div id="vector-pipeline-section" style="display: none;">
            <h3>3. Background Removal & Vector Tracing</h3>
            
            <button id="btn-remove-bg" style="background: #ef6c00;">Step 1: Remove White Background</button>
            
            <div class="control-group" style="margin-top: 6px;">
                <div class="row" style="justify-content: space-between;">
                    <label>Max Palette Colors (2 - 20):</label>
                    <span id="color-count-val" style="font-size:0.8rem; color:#00a8ff; font-weight:bold;">8</span>
                </div>
                <input type="range" id="color-count-slider" min="2" max="20" value="8">
            </div>

            <div class="control-group">
                <div class="row" style="justify-content: space-between;">
                    <label>Noise & Speckle Filter:</label>
                    <span id="noise-filter-val" style="font-size:0.8rem; color:#00a8ff; font-weight:bold;">Medium</span>
                </div>
                <input type="range" id="noise-slider" min="1" max="10" value="4">
            </div>

            <button id="btn-trace-vector" style="background: #2e7d32; margin-top: 4px;">Step 2: Trace to Vector Layer</button>
        </div>

        <!-- COLOR PALETTE MAPPER -->
        <div id="color-mapping-section" style="display: none;">
            <h3>4. Vector Color Palette Mapping</h3>
            <div class="control-group">
                <div class="row" style="justify-content: space-between; align-items:center;">
                    <label>Detected Clean Colors (<span id="vector-color-count">0</span>):</label>
                    <button id="btn-start-over" style="background: #c62828; font-size: 0.75rem; padding: 4px 8px;">Start Over / Reset</button>
                </div>
                <div class="color-map-list" id="color-map-container"></div>
            </div>
        </div>

        <!-- OBJECT CONTROLS & LAYERS -->
        <h3>5. Selected Layer Controls</h3>
        <div class="control-group">
            <label>Dimensions (Inches):</label>
            <div class="row">
                <div>
                    <label>W:</label>
                    <input type="number" id="obj-w" step="0.1" disabled>
                </div>
                <div>
                    <label>H:</label>
                    <input type="number" id="obj-h" step="0.1" disabled>
                </div>
            </div>
        </div>

        <div class="control-group">
            <label>Layer Ordering & Deletion:</label>
            <div class="row">
                <button id="btn-front">Bring to Front</button>
                <button id="btn-back">Send to Back</button>
            </div>
            <button id="btn-delete" style="background: #c62828; margin-top: 4px;">Delete Selected (Del / Backspace)</button>
        </div>

        <!-- THREAD COLORS PALETTE -->
        <h3>6. Thread Palette</h3>
        <div class="control-group">
            <div class="palette" id="thread-palette">
                <div class="swatch active" style="background:#003DA5;" data-color="#003DA5" title="Royal Blue"></div>
                <div class="swatch" style="background:#00205B;" data-color="#00205B" title="Navy"></div>
                <div class="swatch" style="background:#E31B23;" data-color="#E31B23" title="Red"></div>
                <div class="swatch" style="background:#00843D;" data-color="#00843D" title="Emerald Green"></div>
                <div class="swatch" style="background:#FFD100;" data-color="#FFD100" title="Yellow"></div>
                <div class="swatch" style="background:#FF6700;" data-color="#FF6700" title="Orange"></div>
                <div class="swatch" style="background:#685BC7;" data-color="#685BC7" title="Purple"></div>
                <div class="swatch" style="background:#000000;" data-color="#000000" title="Black"></div>
                <div class="swatch" style="background:#FFFFFF; border-color:#aaa;" data-color="#FFFFFF" title="White"></div>
            </div>
            <div class="row" style="margin-top: 8px;">
                <label>Custom Thread Color Picker:</label>
                <input type="color" id="custom-thread-color" value="#003DA5">
            </div>
        </div>

        <!-- OUTPUT & PREVIEW -->
        <h3>7. Stitch Preview & PES Export</h3>
        <button id="toggle-preview-btn" style="background: #2e7d32;">Toggle Realistic Stitch Preview</button>
        <button id="export-pes-btn" style="background: #00a8ff; font-weight: bold; margin-top: 5px;">Export Brother .PES File</button>
    </div>

    <!-- MAIN WORKSPACE / CANVAS AREA -->
    <div id="workspace">
        <div id="canvas-area">
            <div id="ruler-corner"></div>
            <canvas id="ruler-top"></canvas>
            <canvas id="ruler-left"></canvas>

            <div id="canvas-wrapper">
                <canvas id="main-canvas"></canvas>
                <canvas id="stitch-preview-canvas"></canvas>
            </div>
        </div>
    </div>

    <script>
        const DPI = 96;
        const hoopPresets = {
            '4x4': { w: 4, h: 4 },
            '5x7': { w: 5, h: 7 },
            '6x10': { w: 6, h: 10 },
            '8x8': { w: 8, h: 8 },
            '8x12': { w: 8, h: 12 },
            '9.5x14': { w: 9.5, h: 14 }
        };

        let currentHoop = { w: 5, h: 7 };
        let isLandscape = false;
        let activeThreadColor = '#003DA5';

        // Original image backup & state
        let originalImageElement = null;
        let currentVectorGroup = null;
        let selectedColorIndex = null;
        let vectorColorMap = [];

        const canvas = new fabric.Canvas('main-canvas', { selection: true });
        const overlayCanvas = document.getElementById('stitch-preview-canvas');
        const overlayCtx = overlayCanvas.getContext('2d');

        function updateHoopSize() {
            let widthInches = currentHoop.w;
            let heightInches = currentHoop.h;

            if (isLandscape) {
                [widthInches, heightInches] = [Math.max(widthInches, heightInches), Math.min(widthInches, heightInches)];
            } else {
                [widthInches, heightInches] = [Math.min(widthInches, heightInches), Math.max(widthInches, heightInches)];
            }

            const pxW = widthInches * DPI;
            const pxH = heightInches * DPI;

            canvas.setWidth(pxW);
            canvas.setHeight(pxH);
            overlayCanvas.width = pxW;
            overlayCanvas.height = pxH;

            const wrapper = document.getElementById('canvas-wrapper');
            wrapper.style.width = pxW + 'px';
            wrapper.style.height = pxH + 'px';

            drawRulers(pxW, pxH);
            if (previewActive) renderStitchPreview();
        }

        function drawRulers(pxW, pxH) {
            const rTop = document.getElementById('ruler-top');
            const rLeft = document.getElementById('ruler-left');
            rTop.width = pxW; rTop.height = 30;
            rLeft.width = 30; rLeft.height = pxH;

            const ctxT = rTop.getContext('2d');
            const ctxL = rLeft.getContext('2d');

            ctxT.fillStyle = '#222'; ctxT.fillRect(0,0,pxW,30);
            ctxL.fillStyle = '#222'; ctxL.fillRect(0,0,30,pxH);

            ctxT.fillStyle = '#aaa'; ctxT.strokeStyle = '#666'; ctxT.font = '10px sans-serif';
            ctxL.fillStyle = '#aaa'; ctxL.strokeStyle = '#666'; ctxL.font = '10px sans-serif';

            for (let x = 0; x <= pxW; x += DPI / 4) {
                const isFullInch = x % DPI === 0;
                const tickH = isFullInch ? 15 : (x % (DPI/2) === 0 ? 10 : 5);
                ctxT.beginPath(); ctxT.moveTo(x, 30); ctxT.lineTo(x, 30 - tickH); ctxT.stroke();
                if (isFullInch && x < pxW) ctxT.fillText(`${Math.round(x/DPI)}"`, x + 3, 14);
            }

            for (let y = 0; y <= pxH; y += DPI / 4) {
                const isFullInch = y % DPI === 0;
                const tickW = isFullInch ? 15 : (y % (DPI/2) === 0 ? 10 : 5);
                ctxL.beginPath(); ctxL.moveTo(30, y); ctxL.lineTo(30 - tickW, y); ctxL.stroke();
                if (isFullInch && y < pxH) ctxL.fillText(`${Math.round(y/DPI)}"`, 4, y + 12);
            }
        }

        // Hoop & Orientation Event Handlers
        document.getElementById('hoop-select').addEventListener('change', (e) => {
            const val = e.target.value;
            const customBox = document.getElementById('custom-hoop-inputs');
            if (val === 'custom') {
                customBox.style.display = 'flex';
                currentHoop = { w: parseFloat(document.getElementById('custom-w').value), h: parseFloat(document.getElementById('custom-h').value) };
            } else {
                customBox.style.display = 'none';
                currentHoop = { ...hoopPresets[val] };
            }
            updateHoopSize();
        });

        document.getElementById('orient-portrait').addEventListener('click', function() {
            isLandscape = false;
            this.style.background = '#00a8ff';
            document.getElementById('orient-landscape').style.background = '#333';
            updateHoopSize();
        });

        document.getElementById('orient-landscape').addEventListener('click', function() {
            isLandscape = true;
            this.style.background = '#00a8ff';
            document.getElementById('orient-portrait').style.background = '#333';
            updateHoopSize();
        });

        // IMAGE UPLOAD
        document.getElementById('img-upload').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(f) {
                const imgObj = new Image();
                imgObj.src = f.target.result;
                imgObj.onload = function() {
                    originalImageElement = imgObj;
                    const fabricImg = new fabric.Image(imgObj);
                    fabricImg.scaleToWidth(3.5 * DPI);
                    fabricImg.set({ left: 30, top: 30 });

                    canvas.add(fabricImg);
                    canvas.setActiveObject(fabricImg);

                    document.getElementById('vector-pipeline-section').style.display = 'block';
                    document.getElementById('color-mapping-section').style.display = 'none';
                };
            };
            reader.readAsDataURL(file);
        });

        // STEP 1: REMOVE WHITE/LIGHT BACKGROUND
        document.getElementById('btn-remove-bg').addEventListener('click', () => {
            const activeObj = canvas.getActiveObject();
            if (!activeObj || activeObj.type !== 'image') {
                alert('Please select an uploaded image layer first.');
                return;
            }

            const imgEl = activeObj.getElement();
            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = imgEl.width;
            tempCanvas.height = imgEl.height;
            const ctx = tempCanvas.getContext('2d');
            ctx.drawImage(imgEl, 0, 0);

            const imgData = ctx.getImageData(0, 0, tempCanvas.width, tempCanvas.height);
            const data = imgData.data;

            // Remove pixels with RGB > 235 (Near White / Canvas)
            for (let i = 0; i < data.length; i += 4) {
                if (data[i] > 235 && data[i+1] > 235 && data[i+2] > 235) {
                    data[i + 3] = 0; // Transparent
                }
            }

            ctx.putImageData(imgData, 0, 0);
            const cleanedImg = new Image();
            cleanedImg.src = tempCanvas.toDataURL();
            cleanedImg.onload = function() {
                activeObj.setElement(cleanedImg);
                canvas.renderAll();
            };
        });

        // SLIDER DISPLAYS
        document.getElementById('color-count-slider').addEventListener('input', function() {
            document.getElementById('color-count-val').innerText = this.value;
        });

        document.getElementById('noise-slider').addEventListener('input', function() {
            const labels = ['Very Low', 'Low', 'Low-Med', 'Medium', 'Medium', 'High', 'High', 'Aggressive', 'Very Aggressive', 'Maximum'];
            document.getElementById('noise-filter-val').innerText = labels[this.value - 1];
        });

        // STEP 2: RASTER-TO-VECTOR CONVERSION ENGINE
        document.getElementById('btn-trace-vector').addEventListener('click', () => {
            const activeObj = canvas.getActiveObject();
            if (!activeObj || activeObj.type !== 'image') {
                alert('Please select an image on the canvas to trace.');
                return;
            }

            const imgEl = activeObj.getElement();
            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = imgEl.width;
            tempCanvas.height = imgEl.height;
            const ctx = tempCanvas.getContext('2d');
            ctx.drawImage(imgEl, 0, 0);

            const imageData = ctx.getImageData(0, 0, tempCanvas.width, tempCanvas.height);

            const numColors = parseInt(document.getElementById('color-count-slider').value);
            const noiseVal = parseInt(document.getElementById('noise-slider').value);

            // Options for ImageTracer
            const traceOptions = {
                numberofcolors: numColors,
                pathomit: noiseVal * 4, // Filters small speckle paths
                blurradius: 1, // Smooths anti-aliased jagged borders
                colorsampling: 2, // Deterministic sampling
                strokewidth: 0, // Fill paths only
                viewbox: true
            };

            const svgString = ImageTracer.imagedataToSVG(imageData, traceOptions);

            fabric.loadSVGFromString(svgString, function(objects, options) {
                const vectorGroup = fabric.util.groupSVGElements(objects, options);
                
                vectorGroup.set({
                    left: activeObj.left,
                    top: activeObj.top,
                    scaleX: activeObj.scaleX,
                    scaleY: activeObj.scaleY,
                    angle: activeObj.angle
                });

                canvas.remove(activeObj);
                canvas.add(vectorGroup);
                canvas.setActiveObject(vectorGroup);
                currentVectorGroup = vectorGroup;

                extractVectorColors(vectorGroup);
                document.getElementById('color-mapping-section').style.display = 'block';
                canvas.renderAll();
                if (previewActive) renderStitchPreview();
            });
        });

        // EXTRACT CLEAN VECTOR COLORS FROM PATHS
        function extractVectorColors(group) {
            const uniqueColors = new Set();
            
            function traverse(obj) {
                if (obj.fill && typeof obj.fill === 'string' && obj.fill !== 'none') {
                    uniqueColors.add(obj.fill.toLowerCase());
                }
                if (obj._objects) {
                    obj._objects.forEach(traverse);
                }
            }

            traverse(group);
            
            vectorColorMap = Array.from(uniqueColors).map((hex, idx) => ({
                id: idx,
                origHex: hexToNormalizedHex(hex),
                targetHex: hexToNormalizedHex(hex)
            }));

            selectedColorIndex = vectorColorMap.length > 0 ? 0 : null;
            renderVectorColorMapUI();
        }

        function renderVectorColorMapUI() {
            const container = document.getElementById('color-map-container');
            container.innerHTML = '';
            document.getElementById('vector-color-count').innerText = vectorColorMap.length;

            vectorColorMap.forEach((item, idx) => {
                const row = document.createElement('div');
                row.className = 'color-map-row' + (idx === selectedColorIndex ? ' selected' : '');

                row.innerHTML = `
                    <div class="color-preview-pair">
                        <div class="swatch" style="background:${item.origHex};" title="Vectorized Layer Shade"></div>
                        <span>&rarr;</span>
                        <div class="swatch" style="background:${item.targetHex}; border-color:#00a8ff;" title="Assigned Thread Color"></div>
                    </div>
                    <span style="font-size: 0.75rem; color: #888;">Vector Region #${idx + 1}</span>
                `;

                row.addEventListener('click', () => {
                    selectedColorIndex = idx;
                    document.querySelectorAll('.color-map-row').forEach(r => r.classList.remove('selected'));
                    row.classList.add('selected');
                });

                container.appendChild(row);
            });
        }

        // START OVER / RESET BUTTON
        document.getElementById('btn-start-over').addEventListener('click', () => {
            if (!originalImageElement) return;

            if (currentVectorGroup) {
                canvas.remove(currentVectorGroup);
                currentVectorGroup = null;
            }

            const fabricImg = new fabric.Image(originalImageElement);
            fabricImg.scaleToWidth(3.5 * DPI);
            fabricImg.set({ left: 30, top: 30 });

            canvas.add(fabricImg);
            canvas.setActiveObject(fabricImg);

            document.getElementById('color-mapping-section').style.display = 'none';
            document.getElementById('vector-pipeline-section').style.display = 'block';
            canvas.renderAll();
            if (previewActive) renderStitchPreview();
        });

        // THREAD PALETTE ASSIGNMENT TO VECTOR LAYERS
        document.querySelectorAll('#thread-palette .swatch').forEach(swatch => {
            swatch.addEventListener('click', function() {
                document.querySelectorAll('#thread-palette .swatch').forEach(s => s.classList.remove('active'));
                this.classList.add('active');
                activeThreadColor = this.dataset.color;
                applyThreadColorToVector(activeThreadColor);
            });
        });

        document.getElementById('custom-thread-color').addEventListener('input', function() {
            activeThreadColor = this.value;
            applyThreadColorToVector(activeThreadColor);
        });

        function applyThreadColorToVector(newColorHex) {
            if (selectedColorIndex === null || !vectorColorMap[selectedColorIndex] || !currentVectorGroup) return;

            const targetItem = vectorColorMap[selectedColorIndex];
            const oldColorHex = targetItem.targetHex.toLowerCase();
            targetItem.targetHex = newColorHex;

            function updatePathFills(obj) {
                if (obj.fill && typeof obj.fill === 'string') {
                    if (hexToNormalizedHex(obj.fill).toLowerCase() === oldColorHex) {
                        obj.set('fill', newColorHex);
                    }
                }
                if (obj._objects) {
                    obj._objects.forEach(updatePathFills);
                }
            }

            updatePathFills(currentVectorGroup);
            renderVectorColorMapUI();
            canvas.renderAll();
            if (previewActive) renderStitchPreview();
        }

        // TEXT CREATION
        document.getElementById('add-text-btn').addEventListener('click', () => {
            const textVal = document.getElementById('text-input').value || 'SHIFTY';
            const fontFamily = document.getElementById('font-select').value;

            const text = new fabric.Text(textVal, {
                left: 50, top: 50,
                fontFamily: fontFamily,
                fill: activeThreadColor,
                fontSize: 48
            });
            canvas.add(text);
            canvas.setActiveObject(text);
        });

        // LAYER MANAGEMENT
        document.getElementById('btn-front').addEventListener('click', () => {
            const active = canvas.getActiveObject();
            if (active) { canvas.bringToFront(active); canvas.renderAll(); }
        });

        document.getElementById('btn-back').addEventListener('click', () => {
            const active = canvas.getActiveObject();
            if (active) { canvas.sendToBack(active); canvas.renderAll(); }
        });

        function deleteActiveObjects() {
            const activeObjects = canvas.getActiveObjects();
            if (activeObjects.length > 0) {
                activeObjects.forEach(obj => canvas.remove(obj));
                canvas.discardActiveObject();
                canvas.renderAll();
                updateObjectInputs();
            }
        }

        document.getElementById('btn-delete').addEventListener('click', deleteActiveObjects);

        window.addEventListener('keydown', (e) => {
            if ((e.key === 'Delete' || e.key === 'Backspace') && 
                !['INPUT', 'SELECT', 'TEXTAREA'].includes(document.activeElement.tagName)) {
                deleteActiveObjects();
            }
        });

        function updateObjectInputs() {
            const active = canvas.getActiveObject();
            const wInput = document.getElementById('obj-w');
            const hInput = document.getElementById('obj-h');

            if (active) {
                wInput.disabled = false; hInput.disabled = false;
                wInput.value = (active.getBoundingRect().width / DPI).toFixed(2);
                hInput.value = (active.getBoundingRect().height / DPI).toFixed(2);
            } else {
                wInput.disabled = true; hInput.disabled = true;
                wInput.value = ''; hInput.value = '';
            }
        }

        canvas.on('selection:created', updateObjectInputs);
        canvas.on('selection:updated', updateObjectInputs);
        canvas.on('selection:cleared', updateObjectInputs);

        // STITCH GENERATOR FROM VECTOR OBJECTS
        function generateStitches() {
            const objects = canvas.getObjects();
            if (objects.length === 0) return [];

            const pxToDeciMM = 254 / DPI;
            const centerPxX = canvas.width / 2;
            const centerPxY = canvas.height / 2;
            const colorBlocks = [];

            objects.forEach(obj => {
                const tempCanvas = document.createElement('canvas');
                tempCanvas.width = canvas.width;
                tempCanvas.height = canvas.height;
                const tCtx = tempCanvas.getContext('2d');

                const staticCanvas = new fabric.StaticCanvas(null, { width: canvas.width, height: canvas.height });
                staticCanvas.add(obj);
                staticCanvas.renderAll();
                tCtx.drawImage(staticCanvas.getElement(), 0, 0);

                const imgData = tCtx.getImageData(0, 0, canvas.width, canvas.height).data;

                const colorsInObj = {};
                for (let i = 0; i < imgData.length; i += 16) {
                    if (imgData[i + 3] > 128) {
                        const hex = rgbToHex(imgData[i], imgData[i+1], imgData[i+2]);
                        colorsInObj[hex] = true;
                    }
                }

                Object.keys(colorsInObj).forEach(colorHex => {
                    const targetRgb = hexToRgb(colorHex);
                    const stitches = [];
                    const rowSpacing = 4;

                    for (let y = 0; y < canvas.height; y += rowSpacing) {
                        const isEven = (y / rowSpacing) % 2 === 0;
                        const xStart = isEven ? 0 : canvas.width - 1;
                        const xEnd = isEven ? canvas.width : -1;
                        const xStep = isEven ? 3 : -3;

                        for (let x = xStart; isEven ? x < xEnd : x > xEnd; x += xStep) {
                            const idx = (y * canvas.width + x) * 4;
                            if (imgData[idx + 3] > 128) {
                                const dr = Math.abs(imgData[idx] - targetRgb.r);
                                const dg = Math.abs(imgData[idx+1] - targetRgb.g);
                                const db = Math.abs(imgData[idx+2] - targetRgb.b);

                                if (dr + dg + db < 30) {
                                    stitches.push({
                                        x: Math.round((x - centerPxX) * pxToDeciMM),
                                        y: Math.round((y - centerPxY) * pxToDeciMM),
                                        screenX: x, screenY: y
                                    });
                                }
                            }
                        }
                    }

                    if (stitches.length > 0) {
                        colorBlocks.push({ color: colorHex, stitches: stitches });
                    }
                });
            });

            return colorBlocks;
        }

        // REALISTIC STITCH PREVIEW OVERLAY
        let previewActive = false;
        document.getElementById('toggle-preview-btn').addEventListener('click', () => {
            previewActive = !previewActive;
            overlayCanvas.style.display = previewActive ? 'block' : 'none';
            if (previewActive) renderStitchPreview();
        });

        function renderStitchPreview() {
            overlayCtx.clearRect(0, 0, overlayCanvas.width, overlayCanvas.height);
            overlayCtx.fillStyle = '#121212';
            overlayCtx.fillRect(0, 0, overlayCanvas.width, overlayCanvas.height);

            const blocks = generateStitches();

            blocks.forEach(block => {
                const stitches = block.stitches;
                if (stitches.length < 2) return;

                // Pass 1: Drop Shadow
                overlayCtx.strokeStyle = 'rgba(0,0,0,0.5)';
                overlayCtx.lineWidth = 2.2;
                overlayCtx.beginPath();
                for (let i = 0; i < stitches.length - 1; i++) {
                    const p1 = stitches[i], p2 = stitches[i+1];
                    if (Math.hypot(p2.screenX - p1.screenX, p2.screenY - p1.screenY) < 15) {
                        overlayCtx.moveTo(p1.screenX + 1, p1.screenY + 1);
                        overlayCtx.lineTo(p2.screenX + 1, p2.screenY + 1);
                    }
                }
                overlayCtx.stroke();

                // Pass 2: Main Thread
                overlayCtx.strokeStyle = block.color;
                overlayCtx.lineWidth = 1.8;
                overlayCtx.lineCap = 'round';
                overlayCtx.beginPath();
                for (let i = 0; i < stitches.length - 1; i++) {
                    const p1 = stitches[i], p2 = stitches[i+1];
                    if (Math.hypot(p2.screenX - p1.screenX, p2.screenY - p1.screenY) < 15) {
                        overlayCtx.moveTo(p1.screenX, p1.screenY);
                        overlayCtx.lineTo(p2.screenX, p2.screenY);
                    }
                }
                overlayCtx.stroke();
            });
        }

        // BINARY BROTHER .PES ENCODER
        document.getElementById('export-pes-btn').addEventListener('click', () => {
            const blocks = generateStitches();
            if (blocks.length === 0) {
                alert("Please import artwork or text to export.");
                return;
            }

            const pesBytes = buildPesBinary(blocks);
            const blob = new Blob([pesBytes], { type: "application/x-embroidery" });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = "embroidery_design.pes";
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        });

        function buildPesBinary(blocks) {
            const pecStitches = [];
            let lastX = 0, lastY = 0;

            blocks.forEach((block, bIdx) => {
                if (bIdx > 0) {
                    pecStitches.push(0xFE, 0xB0, (bIdx % 8) + 1);
                }

                block.stitches.forEach((pt, pIdx) => {
                    let dx = pt.x - lastX;
                    let dy = pt.y - lastY;
                    let isJump = pIdx === 0 || Math.abs(dx) > 110 || Math.abs(dy) > 110;

                    encodePecDelta(pecStitches, dx, dy, isJump);
                    lastX = pt.x;
                    lastY = pt.y;
                });
            });

            pecStitches.push(0xFF, 0x00);

            const pecHeader = new Uint8Array(512);
            const label = "LA:SHIFTY        ";
            for (let i = 0; i < label.length; i++) pecHeader[i] = label.charCodeAt(i);
            pecHeader[0x0D] = 0x30;
            pecHeader[0x1D] = blocks.length;

            blocks.forEach((b, i) => { pecHeader[0x1E + i] = (i % 8) + 1; });

            const pecOffset = 0x200;
            const totalSize = pecOffset + pecHeader.length + pecStitches.length;
            const buffer = new Uint8Array(totalSize);

            const signature = "#PES0001";
            for (let i = 0; i < signature.length; i++) buffer[i] = signature.charCodeAt(i);

            buffer[0x08] = pecOffset & 0xFF;
            buffer[0x09] = (pecOffset >> 8) & 0xFF;
            buffer[0x0A] = (pecOffset >> 16) & 0xFF;
            buffer[0x0B] = (pecOffset >> 24) & 0xFF;

            buffer.set(pecHeader, pecOffset);
            buffer.set(new Uint8Array(pecStitches), pecOffset + pecHeader.length);

            return buffer;
        }

        function encodePecDelta(arr, dx, dy, isJump) {
            function encodeVal(v, jump) {
                if (!jump && v >= -64 && v <= 63) {
                    arr.push(v & 0x7F);
                } else {
                    let code = v & 0x0FFF;
                    if (jump) code |= 0x1000;
                    code |= 0x8000;
                    arr.push((code >> 8) & 0xFF, code & 0xFF);
                }
            }
            encodeVal(dx, isJump);
            encodeVal(dy, isJump);
        }

        function hexToRgb(hex) {
            const normalized = hexToNormalizedHex(hex);
            const num = parseInt(normalized.replace('#',''), 16);
            return { r: (num >> 16) & 255, g: (num >> 8) & 255, b: num & 255 };
        }

        function rgbToHex(r, g, b) {
            return '#' + [r, g, b].map(x => x.toString(16).padStart(2, '0')).join('');
        }

        function hexToNormalizedHex(hex) {
            if (!hex) return '#000000';
            if (hex.startsWith('rgb')) {
                const rgb = hex.match(/\d+/g);
                if (rgb) return rgbToHex(parseInt(rgb[0]), parseInt(rgb[1]), parseInt(rgb[2]));
            }
            let h = hex.replace('#', '');
            if (h.length === 3) h = h.split('').map(c => c + c).join('');
            return '#' + h;
        }

        updateHoopSize();
    </script>
