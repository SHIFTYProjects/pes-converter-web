<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PES Embroidery Studio - Vector Geometry Digitizer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Lobster&family=Montserrat:wght@400;700&family=Open+Sans:wght@400;700&family=Oswald:wght@500;700&family=Pacifico&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #121212; color: #e0e0e0; margin: 0; padding: 15px; display: flex; height: 100vh; overflow: hidden; user-select: none; }
        
        #sidebar { width: 440px; min-width: 340px; max-width: 800px; background: #1e1e1e; padding: 18px; border-radius: 8px 0 0 8px; display: flex; flex-direction: column; gap: 12px; overflow-y: auto; height: calc(100vh - 30px); border: 1px solid #333; }
        
        #resizer { width: 8px; background: #282828; cursor: col-resize; transition: background 0.2s; border-top: 1px solid #333; border-bottom: 1px solid #333; display: flex; align-items: center; justify-content: center; }
        #resizer:hover, #resizer.active { background: #00a8ff; }
        #resizer::after { content: "┊"; color: #888; font-size: 14px; }

        h2 { margin: 0 0 2px 0; font-size: 1.25rem; color: #00a8ff; }
        h3 { margin: 8px 0 4px 0; font-size: 0.82rem; text-transform: uppercase; letter-spacing: 1px; color: #00a8ff; border-bottom: 1px solid #333; padding-bottom: 4px; }
        
        .control-group { display: flex; flex-direction: column; gap: 6px; }
        .row { display: flex; gap: 8px; align-items: center; }
        .row > * { flex: 1; }

        label { font-size: 0.78rem; color: #aaa; display: flex; justify-content: space-between; }
        button, select, input[type="text"], input[type="number"], input[type="range"] { padding: 7px 9px; background: #2a2a2a; color: white; border: 1px solid #444; border-radius: 4px; font-size: 0.85rem; }
        button { cursor: pointer; background: #333; transition: 0.2s; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 4px; border: 1px solid #444; }
        button:hover { background: #00a8ff; color: #fff; border-color: #00a8ff; }
        button:disabled { opacity: 0.4; cursor: not-allowed; }

        .checkbox-row { display: flex; align-items: center; gap: 8px; font-size: 0.8rem; color: #ccc; cursor: pointer; }
        .checkbox-row input { cursor: pointer; }
        
        .palette { display: grid; grid-template-columns: repeat(10, 1fr); gap: 5px; margin-top: 4px; }
        .swatch { aspect-ratio: 1; border-radius: 50%; border: 2px solid #444; cursor: pointer; transition: transform 0.1s; position: relative; }
        .swatch:hover, .swatch.active { transform: scale(1.2); border-color: #00a8ff; z-index: 2; }

        .color-map-list { display: flex; flex-direction: column; gap: 6px; max-height: 160px; overflow-y: auto; background: #161616; padding: 8px; border-radius: 6px; border: 1px solid #333; }
        .color-map-row { display: flex; align-items: center; justify-content: space-between; background: #222; padding: 6px 10px; border-radius: 4px; border: 1px solid #333; cursor: pointer; }
        .color-map-row.selected { border-color: #00a8ff; background: #2a2a2a; }
        .color-preview-pair { display: flex; align-items: center; gap: 8px; font-size: 0.8rem; }

        #workspace { flex-grow: 1; display: flex; flex-direction: column; background: #141414; border-radius: 0 8px 8px 0; padding: 10px; border: 1px solid #333; border-left: none; position: relative; overflow: hidden; }
        #canvas-toolbar { display: flex; align-items: center; justify-content: space-between; background: #1e1e1e; padding: 6px 12px; border-radius: 6px; margin-bottom: 8px; border: 1px solid #333; }
        .toolbar-group { display: flex; align-items: center; gap: 8px; }

        #canvas-viewport { flex-grow: 1; overflow: auto; display: flex; position: relative; background: #0a0a0a; border-radius: 6px; border: 1px solid #222; }
        #canvas-area { position: relative; margin: auto; display: grid; grid-template-columns: 30px 1fr; grid-template-rows: 30px 1fr; }
        
        #ruler-top { grid-column: 2; grid-row: 1; background: #222; border-bottom: 1px solid #444; }
        #ruler-left { grid-column: 1; grid-row: 2; background: #222; border-right: 1px solid #444; }
        #ruler-corner { grid-column: 1; grid-row: 1; background: #1a1a1a; border-right: 1px solid #444; border-bottom: 1px solid #444; }
        
        #canvas-wrapper { 
            grid-column: 2; grid-row: 2; position: relative; 
            background-color: #ffffff;
            background-image: 
                linear-gradient(45deg, #d0d0d0 25%, transparent 25%), 
                linear-gradient(-45deg, #d0d0d0 25%, transparent 25%), 
                linear-gradient(45deg, transparent 75%, #d0d0d0 75%), 
                linear-gradient(-45deg, transparent 75%, #d0d0d0 75%);
            background-size: 20px 20px;
            background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
            border: 2px dashed #00a8ff; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); 
            transform-origin: 0 0;
        }
        #stitch-preview-canvas { position: absolute; top: 0; left: 0; pointer-events: none; display: none; z-index: 10; background: #121212; }
        .stats-badge { font-size: 0.75rem; background: #2a2a2a; border: 1px solid #444; padding: 4px 8px; border-radius: 4px; color: #00a8ff; font-weight: bold; }
    </style>
</head>
<body>

    <div id="sidebar">
        <div class="row" style="justify-content: space-between; align-items: center;">
            <h2>PES Embroidery Studio</h2>
            <button id="btn-undo" style="background:#2a2a2a; border-color:#00a8ff; padding: 4px 10px;" title="Undo Action (Ctrl+Z)" disabled>↶ Undo</button>
        </div>

        <h3>1. Hoop & Orientation</h3>
        <div class="control-group">
            <label>Hoop Size Preset:</label>
            <select id="hoop-select">
                <option value="4x4">4" x 4" (100 x 100 mm)</option>
                <option value="5x7" selected>5" x 7" (130 x 180 mm)</option>
                <option value="6x10">6" x 10" (160 x 260 mm)</option>
                <option value="8x8">8" x 8" (200 x 200 mm)</option>
                <option value="8x12">8" x 12" (200 x 300 mm)</option>
            </select>
        </div>
        <div class="control-group">
            <div class="row">
                <button id="orient-portrait" style="background:#00a8ff;">Portrait</button>
                <button id="orient-landscape">Landscape</button>
            </div>
        </div>

        <h3>2. Import Vector / Text</h3>
        <div class="control-group">
            <input type="file" id="img-upload" accept="image/*" style="display:none;">
            <button onclick="document.getElementById('img-upload').click()">Upload Image to Trace (PNG/JPG)</button>
        </div>
        <div class="control-group" style="margin-top: 4px;">
            <div class="row">
                <input type="text" id="text-input" placeholder="e.g. SHIFTY">
                <button id="add-text-btn">Add Text</button>
            </div>
            <label style="margin-top:4px;">Font Style:</label>
            <select id="font-select">
                <optgroup label="Standard System Fonts">
                    <option value="Arial" selected>Arial</option>
                    <option value="Impact">Impact</option>
                    <option value="Verdana">Verdana</option>
                    <option value="Georgia">Georgia</option>
                    <option value="Courier New">Courier New</option>
                </optgroup>
                <optgroup label="Web & Google Fonts">
                    <option value="Roboto">Roboto</option>
                    <option value="Montserrat">Montserrat</option>
                    <option value="Oswald">Oswald (Bold)</option>
                    <option value="Anton">Anton (Heavy)</option>
                    <option value="Lobster">Lobster (Script)</option>
                    <option value="Pacifico">Pacifico (Handwritten)</option>
                </optgroup>
            </select>
        </div>

        <div id="vector-pipeline-section" style="display: none;">
            <h3>3. Vector Tracing Engine</h3>
            <button id="btn-remove-bg" style="background: #ef6c00;">Step 1: Outer Background Fill Cleanup</button>
            
            <div class="control-group" style="margin-top: 6px;">
                <label>Max Palette Colors: <span id="color-count-val" style="color:#00a8ff; font-weight:bold;">6</span></label>
                <input type="range" id="color-count-slider" min="2" max="16" value="6">
            </div>
            <div class="control-group">
                <label>Speckle / Noise Filter: <span id="noise-filter-val" style="color:#00a8ff; font-weight:bold;">Medium</span></label>
                <input type="range" id="noise-slider" min="1" max="10" value="4">
            </div>
            <button id="btn-trace-vector" style="background: #2e7d32; margin-top: 4px;">Step 2: Vectorize Paths</button>
        </div>

        <div id="color-mapping-section" style="display: none;">
            <h3>4. Vector Layer Colors (<span id="vector-color-count">0</span>)</h3>
            <div class="control-group">
                <div class="color-map-list" id="color-map-container"></div>
            </div>
        </div>

        <h3>5. Geometry Digitizing Parameters</h3>
        <div class="control-group">
            <label>Tatami Fill Density (Row Pitch): <span id="val-density" style="color:#00a8ff;">0.40 mm</span></label>
            <input type="range" id="param-density" min="0.20" max="1.0" step="0.05" value="0.40">
        </div>
        <div class="control-group">
            <label>Tatami Fill Angle: <span id="val-angle" style="color:#00a8ff;">45°</span></label>
            <input type="range" id="param-angle" min="0" max="180" step="5" value="45">
        </div>
        <div class="control-group">
            <label>Max Stitch Length: <span id="val-max-length" style="color:#00a8ff;">3.5 mm</span></label>
            <input type="range" id="param-max-length" min="1.5" max="7.0" step="0.5" value="3.5">
        </div>
        <div class="control-group">
            <label>Pull Compensation (Inset/Expand): <span id="val-pull-comp" style="color:#00a8ff;">0.15 mm</span></label>
            <input type="range" id="param-pull-comp" min="0.0" max="0.5" step="0.05" value="0.15">
        </div>
        <div class="control-group">
            <label>Jump / Trim Distance Threshold: <span id="val-trim-dist" style="color:#00a8ff;">6.0 mm</span></label>
            <input type="range" id="param-trim-dist" min="2.0" max="15.0" step="1.0" value="6.0">
        </div>
        <div class="control-group" style="margin-top:4px;">
            <label class="checkbox-row">
                <input type="checkbox" id="param-underlay" checked> Generate Underlay Contour Run
            </label>
            <label class="checkbox-row">
                <input type="checkbox" id="param-tie-stitches" checked> Auto Lock Stitches (Tie-In / Tie-Off)
            </label>
        </div>

        <h3>6. Thread Palette</h3>
        <div class="control-group">
            <div class="palette" id="thread-palette">
                <div class="swatch active" style="background:#003DA5;" data-color="#003DA5" title="Royal Blue"></div>
                <div class="swatch" style="background:#00205B;" data-color="#00205B" title="Navy Blue"></div>
                <div class="swatch" style="background:#E31B23;" data-color="#E31B23" title="Red"></div>
                <div class="swatch" style="background:#00843D;" data-color="#00843D" title="Emerald Green"></div>
                <div class="swatch" style="background:#FFD100;" data-color="#FFD100" title="Yellow"></div>
                <div class="swatch" style="background:#FF6700;" data-color="#FF6700" title="Orange"></div>
                <div class="swatch" style="background:#685BC7;" data-color="#685BC7" title="Purple"></div>
                <div class="swatch" style="background:#000000;" data-color="#000000" title="Black"></div>
                <div class="swatch" style="background:#FFFFFF; border-color:#aaa;" data-color="#FFFFFF" title="White"></div>
                <div class="swatch" style="background:#808080;" data-color="#808080" title="Grey"></div>
            </div>
        </div>

        <h3>7. Stitch Preview & PES Output</h3>
        <div class="stats-badge" id="stitch-stats">Stitches: 0 | Colors: 0 | Jumps: 0</div>
        <button id="toggle-preview-btn" style="background: #2e7d32; margin-top: 6px;">Toggle Realistic Stitch Engine Preview</button>
        <button id="export-pes-btn" style="background: #00a8ff; font-weight: bold; margin-top: 5px;">Export Valid Brother .PES File</button>
    </div>

    <div id="resizer"></div>

    <div id="workspace">
        <div id="canvas-toolbar">
            <div class="toolbar-group">
                <span style="font-size: 0.85rem; color:#aaa;">Canvas Zoom:</span>
                <button id="btn-zoom-out" style="padding: 3px 8px;">-</button>
                <span id="zoom-level-text" style="font-size:0.85rem; font-weight:bold; width: 45px; text-align:center;">100%</span>
                <button id="btn-zoom-in" style="padding: 3px 8px;">+</button>
                <button id="btn-zoom-reset" style="padding: 3px 8px; font-size: 0.75rem;">Reset</button>
            </div>
            <div class="toolbar-group">
                <button id="btn-delete" style="background: #c62828; padding: 4px 8px; font-size: 0.75rem;">Delete Layer</button>
            </div>
        </div>

        <div id="canvas-viewport">
            <div id="canvas-area">
                <div id="ruler-corner"></div>
                <canvas id="ruler-top"></canvas>
                <canvas id="ruler-left"></canvas>

                <div id="canvas-wrapper">
                    <canvas id="main-canvas"></canvas>
                    <canvas id="stitch-preview-canvas"></canvas>
                </div>
            </div>
        </div>
    </div>

    <script>
        const DPI = 96;
        const MM_TO_PX = DPI / 25.4; 
        const PX_TO_DECIMM = 254 / DPI; 

        const hoopPresets = {
            '4x4': { w: 4, h: 4 },
            '5x7': { w: 5, h: 7 },
            '6x10': { w: 6, h: 10 },
            '8x8': { w: 8, h: 8 },
            '8x12': { w: 8, h: 12 }
        };

        let currentHoop = { w: 5, h: 7 };
        let isLandscape = false;
        let activeThreadColor = '#003DA5';
        let zoomLevel = 1.0;

        let originalImageElement = null;
        let workingImageObject = null;
        let currentVectorGroup = null;
        let selectedColorIndex = null;
        let vectorColorMap = [];

        const undoStack = [];
        let isUndoStateLock = false;

        const canvas = new fabric.Canvas('main-canvas', { selection: true, backgroundColor: 'transparent' });
        const overlayCanvas = document.getElementById('stitch-preview-canvas');
        const overlayCtx = overlayCanvas.getContext('2d');

        function saveCanvasState() {
            if (isUndoStateLock) return;
            if (undoStack.length >= 25) undoStack.shift();
            undoStack.push(JSON.stringify(canvas.toJSON()));
            document.getElementById('btn-undo').disabled = undoStack.length <= 1;
        }

        function undo() {
            if (undoStack.length > 1) {
                undoStack.pop();
                const prevState = undoStack[undoStack.length - 1];
                isUndoStateLock = true;
                canvas.loadFromJSON(prevState, () => {
                    canvas.renderAll();
                    isUndoStateLock = false;
                    document.getElementById('btn-undo').disabled = undoStack.length <= 1;
                    if (previewActive) renderStitchPreview();
                });
            }
        }

        document.getElementById('btn-undo').addEventListener('click', undo);
        canvas.on('object:added', saveCanvasState);
        canvas.on('object:modified', saveCanvasState);
        canvas.on('object:removed', saveCanvasState);

        const sidebar = document.getElementById('sidebar');
        const resizer = document.getElementById('resizer');
        let isResizing = false;

        resizer.addEventListener('mousedown', () => {
            isResizing = true;
            resizer.classList.add('active');
            document.body.style.cursor = 'col-resize';
        });

        window.addEventListener('mousemove', (e) => {
            if (!isResizing) return;
            if (e.clientX >= 320 && e.clientX <= 800) sidebar.style.width = e.clientX + 'px';
        });

        window.addEventListener('mouseup', () => {
            if (isResizing) {
                isResizing = false;
                resizer.classList.remove('active');
                document.body.style.cursor = 'default';
            }
        });

        function setZoom(newZoom) {
            zoomLevel = Math.min(Math.max(newZoom, 0.3), 3.0);
            document.getElementById('zoom-level-text').innerText = Math.round(zoomLevel * 100) + '%';
            
            const wrapper = document.getElementById('canvas-wrapper');
            wrapper.style.transform = `scale(${zoomLevel})`;
            
            const area = document.getElementById('canvas-area');
            area.style.width = (30 + canvas.width * zoomLevel) + 'px';
            area.style.height = (30 + canvas.height * zoomLevel) + 'px';
            
            drawRulers(canvas.width, canvas.height);
        }

        document.getElementById('btn-zoom-in').addEventListener('click', () => setZoom(zoomLevel + 0.15));
        document.getElementById('btn-zoom-out').addEventListener('click', () => setZoom(zoomLevel - 0.15));
        document.getElementById('btn-zoom-reset').addEventListener('click', () => setZoom(1.0));

        function updateHoopSize() {
            let wIn = isLandscape ? Math.max(currentHoop.w, currentHoop.h) : Math.min(currentHoop.w, currentHoop.h);
            let hIn = isLandscape ? Math.min(currentHoop.w, currentHoop.h) : Math.max(currentHoop.w, currentHoop.h);

            const pxW = wIn * DPI;
            const pxH = hIn * DPI;

            canvas.setWidth(pxW);
            canvas.setHeight(pxH);
            overlayCanvas.width = pxW;
            overlayCanvas.height = pxH;

            const wrapper = document.getElementById('canvas-wrapper');
            wrapper.style.width = pxW + 'px';
            wrapper.style.height = pxH + 'px';

            setZoom(zoomLevel);
            if (previewActive) renderStitchPreview();
        }

        function drawRulers(pxW, pxH) {
            const rTop = document.getElementById('ruler-top');
            const rLeft = document.getElementById('ruler-left');
            const scaledW = pxW * zoomLevel, scaledH = pxH * zoomLevel;

            rTop.width = scaledW; rTop.height = 30;
            rLeft.width = 30; rLeft.height = scaledH;

            const ctxT = rTop.getContext('2d'), ctxL = rLeft.getContext('2d');
            ctxT.fillStyle = '#222'; ctxT.fillRect(0,0,scaledW,30);
            ctxL.fillStyle = '#222'; ctxL.fillRect(0,0,30,scaledH);

            ctxT.fillStyle = '#aaa'; ctxT.strokeStyle = '#666'; ctxT.font = '10px sans-serif';
            ctxL.fillStyle = '#aaa'; ctxL.strokeStyle = '#666'; ctxL.font = '10px sans-serif';

            const step = (DPI / 4) * zoomLevel;
            const fullInchStep = DPI * zoomLevel;

            for (let x = 0; x <= scaledW; x += step) {
                const isFull = Math.abs(x % fullInchStep) < 1;
                ctxT.beginPath(); ctxT.moveTo(x, 30); ctxT.lineTo(x, 30 - (isFull ? 15 : 6)); ctxT.stroke();
                if (isFull && x < scaledW) ctxT.fillText(`${Math.round(x/fullInchStep)}"`, x + 3, 14);
            }

            for (let y = 0; y <= scaledH; y += step) {
                const isFull = Math.abs(y % fullInchStep) < 1;
                ctxL.beginPath(); ctxL.moveTo(30, y); ctxL.lineTo(30 - (isFull ? 15 : 6), y); ctxL.stroke();
                if (isFull && y < scaledH) ctxL.fillText(`${Math.round(y/fullInchStep)}"`, 4, y + 12);
            }
        }

        document.getElementById('hoop-select').addEventListener('change', (e) => {
            currentHoop = { ...hoopPresets[e.target.value] };
            updateHoopSize();
        });

        document.getElementById('orient-portrait').addEventListener('click', function() {
            isLandscape = false;
            this.style.background = '#00a8ff';
            document.getElementById('orient-landscape').style.background = '#333';
            updateHoopSize();
        });

        document.getElementById('orient-landscape').addEventListener('click', function() {
            isLandscape = true;
            this.style.background = '#00a8ff';
            document.getElementById('orient-portrait').style.background = '#333';
            updateHoopSize();
        });

        document.getElementById('img-upload').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(f) {
                const imgObj = new Image();
                imgObj.src = f.target.result;
                imgObj.onload = function() {
                    originalImageElement = imgObj;
                    const fabricImg = new fabric.Image(imgObj);
                    fabricImg.scaleToWidth(3.5 * DPI);
                    fabricImg.set({ left: 30, top: 30 });

                    canvas.add(fabricImg);
                    canvas.setActiveObject(fabricImg);
                    workingImageObject = fabricImg;

                    document.getElementById('vector-pipeline-section').style.display = 'block';
                    document.getElementById('color-mapping-section').style.display = 'none';
                };
            };
            reader.readAsDataURL(file);
        });

        document.getElementById('btn-remove-bg').addEventListener('click', () => {
            let activeObj = canvas.getActiveObject() || workingImageObject;
            if (!activeObj || activeObj.type !== 'image') return alert('Select image layer.');

            const imgEl = activeObj.getElement();
            const nativeW = imgEl.naturalWidth || imgEl.width;
            const nativeH = imgEl.naturalHeight || imgEl.height;

            const tempCanvas = document.createElement('canvas');
            const w = tempCanvas.width = nativeW, h = tempCanvas.height = nativeH;
            const ctx = tempCanvas.getContext('2d');
            ctx.drawImage(imgEl, 0, 0, w, h);

            const imgData = ctx.getImageData(0, 0, w, h);
            const data = imgData.data;

            const bgR = data[0], bgG = data[1], bgB = data[2], bgA = data[3];
            const isBgWhite = bgA === 0 || (bgR > 200 && bgG > 200 && bgB > 200);
            const tR = isBgWhite ? 255 : bgR;
            const tG = isBgWhite ? 255 : bgG;
            const tB = isBgWhite ? 255 : bgB;

            const visited = new Uint8Array(w * h);
            const queue = [];
            for (let x = 0; x < w; x++) { queue.push(x, 0, x, h - 1); }
            for (let y = 0; y < h; y++) { queue.push(0, y, w - 1, y); }

            let qIdx = 0;
            while (qIdx < queue.length) {
                const x = queue[qIdx++], y = queue[qIdx++];
                if (x < 0 || x >= w || y < 0 || y >= h) continue;
                
                const pIdx = y * w + x;
                if (visited[pIdx]) continue;
                visited[pIdx] = 1;

                const dataIdx = pIdx * 4;
                if (data[dataIdx + 3] > 0 && 
                    Math.abs(data[dataIdx] - tR) < 35 && 
                    Math.abs(data[dataIdx + 1] - tG) < 35 && 
                    Math.abs(data[dataIdx + 2] - tB) < 35) {
                    
                    data[dataIdx + 3] = 0;
                    queue.push(x + 1, y, x - 1, y, x, y + 1, x, y - 1);
                }
            }

            ctx.putImageData(imgData, 0, 0);
            const cleanedImg = new Image();
            cleanedImg.onload = function() {
                activeObj.setSrc(cleanedImg.src, function() {
                    canvas.renderAll();
                    saveCanvasState();
                });
            };
            cleanedImg.src = tempCanvas.toDataURL();
        });

        document.getElementById('color-count-slider').addEventListener('input', function() {
            document.getElementById('color-count-val').innerText = this.value;
        });
        document.getElementById('color-count-slider').addEventListener('change', triggerLiveVectorTracing);

        document.getElementById('noise-slider').addEventListener('input', function() {
            const labels = ['Very Low', 'Low', 'Low-Med', 'Medium', 'Medium', 'High', 'High', 'Aggressive', 'Very Aggressive', 'Maximum'];
            document.getElementById('noise-filter-val').innerText = labels[this.value - 1];
        });
        document.getElementById('noise-slider').addEventListener('change', triggerLiveVectorTracing);

        document.getElementById('btn-trace-vector').addEventListener('click', executeVectorTracing);

        function triggerLiveVectorTracing() {
            if (currentVectorGroup || workingImageObject) executeVectorTracing();
        }

        function executeVectorTracing() {
            let targetImgObj = workingImageObject || canvas.getActiveObject();
            if (!targetImgObj || targetImgObj.type !== 'image') return;

            const btn = document.getElementById('btn-trace-vector');
            const originalText = btn.innerText;
            btn.innerText = "Processing Pixel Blobs (Please Wait)...";
            btn.style.background = "#e65100"; 
            btn.disabled = true;

            setTimeout(() => {
                try {
                    processSewArtStyle(targetImgObj);
                } catch (e) {
                    console.error(e);
                    alert("Image processing failed. Try a simpler image.");
                }
                btn.innerText = originalText;
                btn.style.background = "#2e7d32";
                btn.disabled = false;
            }, 50);
        }

        function processSewArtStyle(imgObj) {
            const imgEl = imgObj.getElement();
            const nativeW = imgEl.naturalWidth || imgEl.width;
            const nativeH = imgEl.naturalHeight || imgEl.height;

            const MAX_DIM = 400; 
            let procW = nativeW, procH = nativeH;
            if (procW > MAX_DIM || procH > MAX_DIM) {
                const ratio = Math.min(MAX_DIM / procW, MAX_DIM / procH);
                procW = Math.round(procW * ratio);
                procH = Math.round(procH * ratio);
            }

            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = procW; tempCanvas.height = procH;
            const ctx = tempCanvas.getContext('2d', { willReadFrequently: true });
            ctx.drawImage(imgEl, 0, 0, procW, procH);
            
            const imgData = ctx.getImageData(0, 0, procW, procH);
            const data = imgData.data;
            const numColors = parseInt(document.getElementById('color-count-slider').value);

            const pixels = [];
            for (let i = 0; i < data.length; i += 4) {
                if (data[i+3] > 128) { 
                    pixels.push({ r: data[i], g: data[i+1], b: data[i+2], index: i/4 });
                }
            }
            if(pixels.length === 0) return;

            let clusters = [];
            for (let i = 0; i < numColors; i++) {
                const idx = Math.floor((i / numColors) * pixels.length);
                const p = pixels[idx];
                clusters.push({ r: p.r, g: p.g, b: p.b });
            }

            const pixelLabels = new Int32Array(procW * procH).fill(-1);

            for (let iter = 0; iter < 4; iter++) {
                const sums = Array(numColors).fill(0).map(() => ({r:0, g:0, b:0, count:0}));
                for (let i = 0; i < pixels.length; i++) {
                    const p = pixels[i];
                    let minDist = Infinity, bestC = 0;
                    for (let c = 0; c < numColors; c++) {
                        const d = Math.abs(p.r - clusters[c].r) + Math.abs(p.g - clusters[c].g) + Math.abs(p.b - clusters[c].b);
                        if (d < minDist) { minDist = d; bestC = c; }
                    }
                    pixelLabels[p.index] = bestC;
                    sums[bestC].r += p.r; sums[bestC].g += p.g; sums[bestC].b += p.b; sums[bestC].count++;
                }
                for (let c = 0; c < numColors; c++) {
                    if (sums[c].count > 0) {
                        clusters[c].r = Math.floor(sums[c].r / sums[c].count);
                        clusters[c].g = Math.floor(sums[c].g / sums[c].count);
                        clusters[c].b = Math.floor(sums[c].b / sums[c].count);
                    }
                }
            }

            const polygons = [];
            const scaleX = imgObj.scaleX * (nativeW / procW);
            const scaleY = imgObj.scaleY * (nativeH / procH);
            const noiseTolerance = parseInt(document.getElementById('noise-slider').value) / 2;

            for (let c = 0; c < numColors; c++) {
                const r = Math.round(clusters[c].r) || 0;
                const g = Math.round(clusters[c].g) || 0;
                const b = Math.round(clusters[c].b) || 0;
                const hexColor = "#" + (1 << 24 | r << 16 | g << 8 | b).toString(16).slice(1);
                
                const grid = new Uint8Array(procW * procH);
                let clusterPixelCount = 0;
                for(let i = 0; i < pixelLabels.length; i++) {
                    if(pixelLabels[i] === c) {
                        grid[i] = 1;
                        clusterPixelCount++;
                    }
                }

                if (clusterPixelCount < 10) continue;

                let colorPolys = extractContours(grid, procW, procH);
                
                colorPolys.forEach(pts => {
                    if(pts.length < 4) return;
                    
                    const simplified = simplifyPath(pts, noiseTolerance);
                    if(simplified.length < 3) return;

                    let minX = Infinity, minY = Infinity;
                    simplified.forEach(p => { 
                        if (p.x < minX) minX = p.x; 
                        if (p.y < minY) minY = p.y; 
                    });

                    const scaledMinX = minX * scaleX;
                    const scaledMinY = minY * scaleY;

                    const relativePts = simplified.map(p => ({
                        x: (p.x * scaleX) - scaledMinX, 
                        y: (p.y * scaleY) - scaledMinY 
                    }));

                    const pathData = relativePts.map((p, i) => (i === 0 ? 'M ' : 'L ') + p.x + ' ' + p.y).join(' ') + ' Z';
                    
                    const poly = new fabric.Path(pathData, {
                        fill: hexColor,
                        strokeWidth: 0,
                        left: imgObj.left + scaledMinX,
                        top: imgObj.top + scaledMinY,
                        originX: 'left',
                        originY: 'top',
                        objectCaching: false
                    });
                    
                    poly.originalFill = hexColor; 
                    polygons.push(poly);
                });
            }

            if (polygons.length > 0) {
                const vectorGroup = new fabric.Group(polygons, {
                    left: imgObj.left,
                    top: imgObj.top,
                    angle: imgObj.angle
                });

                if (workingImageObject) canvas.remove(workingImageObject);
                if (currentVectorGroup) canvas.remove(currentVectorGroup);

                canvas.add(vectorGroup);
                canvas.setActiveObject(vectorGroup);
                currentVectorGroup = vectorGroup;

                extractVectorColors(vectorGroup);
                document.getElementById('color-mapping-section').style.display = 'block';
                canvas.renderAll();
                saveCanvasState();
                if (previewActive) renderStitchPreview();
            }
        }

        function extractContours(grid, w, h) {
            const visited = new Uint8Array(w * h);
            const contours = [];
            
            for (let y = 1; y < h - 1; y++) {
                for (let x = 1; x < w - 1; x++) {
                    const idx = y * w + x;
                    if (grid[idx] && !visited[idx]) {
                        if (!grid[idx - 1] || !grid[idx + 1] || !grid[idx - w] || !grid[idx + w]) {
                            const contour = traceMoore(grid, visited, w, h, x, y);
                            if (contour.length > 4) contours.push(contour);
                        } else {
                            visited[idx] = 1; 
                        }
                    }
                }
            }
            return contours;
        }

        function traceMoore(grid, visited, w, h, startX, startY) {
            const contour = [];
            let currX = startX, currY = startY;
            const dx = [0, 1, 1, 1, 0, -1, -1, -1];
            const dy = [-1, -1, 0, 1, 1, 1, 0, -1];
            let enterDir = 0; 

            for (let step = 0; step < 10000; step++) { 
                contour.push({ x: currX, y: currY });
                visited[currY * w + currX] = 1;

                if (step > 0 && currX === startX && currY === startY) break;

                let foundNext = false;
                let checkDir = (enterDir + 2) % 8; 

                for (let i = 0; i < 8; i++) {
                    const dir = (checkDir + i) % 8;
                    const nx = currX + dx[dir];
                    const ny = currY + dy[dir];
                    
                    if (nx >= 0 && nx < w && ny >= 0 && ny < h && grid[ny * w + nx]) {
                        currX = nx;
                        currY = ny;
                        enterDir = (dir + 4) % 8; 
                        foundNext = true;
                        break;
                    }
                }
                if (!foundNext) break; 
            }
            return contour;
        }

        function simplifyPath(points, tolerance) {
            if (points.length <= 2) return points;
            let maxDist = 0;
            let index = 0;
            const end = points.length - 1;
            
            for (let i = 1; i < end; i++) {
                const d = pointLineDist(points[i], points[0], points[end]);
                if (d > maxDist) { maxDist = d; index = i; }
            }
            
            if (maxDist > tolerance) {
                const left = simplifyPath(points.slice(0, index + 1), tolerance);
                const right = simplifyPath(points.slice(index), tolerance);
                return left.slice(0, -1).concat(right);
            }
            return [points[0], points[end]];
        }

        function pointLineDist(p, a, b) {
            const num = Math.abs((b.y - a.y)*p.x - (b.x - a.x)*p.y + b.x*a.y - b.y*a.x);
            const den = Math.hypot(b.y - a.y, b.x - a.x);
            return den === 0 ? Math.hypot(p.x - a.x, p.y - a.y) : num / den;
        }

        function extractVectorColors(group) {
            const uniqueColors = new Map();
            function traverse(obj) {
                if (obj.originalFill) {
                    if (!uniqueColors.has(obj.originalFill)) {
                        uniqueColors.set(obj.originalFill, obj.fill);
                    }
                }
                if (obj._objects) obj._objects.forEach(traverse);
            }
            traverse(group);
            
            vectorColorMap = Array.from(uniqueColors.entries()).map(([orig, current], idx) => ({
                id: idx,
                origHex: orig,
                targetHex: current
            }));

            selectedColorIndex = vectorColorMap.length > 0 ? 0 : null;
            renderVectorColorMapUI();
        }

        function renderVectorColorMapUI() {
            const container = document.getElementById('color-map-container');
            container.innerHTML = '';

        canvas.on('selection:created', handleSelection);

        function handleSelection() {
            const active = canvas.getActiveObject();
            if (!active) return;

                currentVectorGroup = active;

        function generateVectorStitches() {
            const objects = canvas.getObjects();
            if (objects.length === 0) return { colorBlocks: [], totalStitches: 0, totalJumps: 0 };

            const densityMM = parseFloat(document.getElementById('param-density').value);
            const fillAngleDeg = parseFloat(document.getElementById('param-angle').value);
            const maxStitchLenMM = parseFloat(document.getElementById('param-max-length').value);
            const pullCompMM = parseFloat(document.getElementById('param-pull-comp').value);
            const trimThresholdMM = parseFloat(document.getElementById('param-trim-dist').value);
            const hasUnderlay = document.getElementById('param-underlay').checked;
            const hasLockStitches = document.getElementById('param-tie-stitches').checked;

            const densityPx = densityMM * MM_TO_PX;
            const maxStitchLenPx = maxStitchLenMM * MM_TO_PX;
            const pullCompPx = pullCompMM * MM_TO_PX;
            const trimThresholdPx = trimThresholdMM * MM_TO_PX;
            const fillAngleRad = (fillAngleDeg * Math.PI) / 180;

            const colorGroups = {};

            objects.forEach(obj => {
                extractPolygonsFromObject(obj).forEach(polyItem => {
                    const color = polyItem.color.toUpperCase();
                    if (!colorGroups[color]) colorGroups[color] = [];
                    colorGroups[color].push(polyItem.points);
                });
            });

            const colorBlocks = [];
            let globalTotalStitches = 0;
            let globalTotalJumps = 0;

            const centerPxX = canvas.width / 2;
            const centerPxY = canvas.height / 2;

            Object.keys(colorGroups).forEach(colorHex => {
                const polygons = colorGroups[colorHex];
                const rawStitchStream = [];

                polygons.forEach(poly => {
                    if (poly.length < 3) return;

                    if (hasUnderlay) {
                        const insetPoly = insetPolygon(poly, 0.8 * MM_TO_PX);
                        if (insetPoly.length >= 3) {
                            const underlayStitches = resamplePolyline(insetPoly, maxStitchLenPx);
                            appendStitchSequence(rawStitchStream, underlayStitches, trimThresholdPx, hasLockStitches);
                        }
                    }

                    const tatamiStitches = generateTatamiFill(poly, densityPx, fillAngleRad, maxStitchLenPx, pullCompPx);
                    if (tatamiStitches.length > 0) {
                        appendStitchSequence(rawStitchStream, tatamiStitches, trimThresholdPx, hasLockStitches);
                    }
                });

                if (rawStitchStream.length > 0) {
                    const finalStitches = rawStitchStream.map(st => ({
                        x: Math.round((st.x - centerPxX) * PX_TO_DECIMM),
                        y: Math.round((st.y - centerPxY) * PX_TO_DECIMM),
                        screenX: st.x,
                        screenY: st.y,
                        isJump: !!st.isJump
                    }));

                    let jumpsInBlock = finalStitches.filter(s => s.isJump).length;
                    globalTotalJumps += jumpsInBlock;
                    globalTotalStitches += finalStitches.length;

                    colorBlocks.push({ color: colorHex, stitches: finalStitches });
                }
            });

            document.getElementById('stitch-stats').innerText = 
                `Stitches: ${globalTotalStitches} | Colors: ${colorBlocks.length} | Jumps: ${globalTotalJumps}`;

            return { colorBlocks, totalStitches: globalTotalStitches, totalJumps: globalTotalJumps };
        }

        function extractPolygonsFromObject(obj) {
            const results = [];
            
            if (obj.type === 'text' || obj.type === 'i-text') {
                const color = hexToNormalizedHex(obj.fill || '#000000');
                const bound = obj.getBoundingRect();
                const boxPoly = [
                    { x: bound.left, y: bound.top },
                    { x: bound.left + bound.width, y: bound.top },
                    { x: bound.left + bound.width, y: bound.top + bound.height },
                    { x: bound.left, y: bound.top + bound.height }
                ];
                results.push({ color: color, points: boxPoly });
            } else if (obj.type === 'group' && obj._objects) {
                const matrix = obj.calcTransformMatrix();
                obj._objects.forEach(child => {
                    const childColor = hexToNormalizedHex(child.fill || '#000000');
                    let pts = [];
                    if (child.path) {
                        pts = sampleFabricPath(child.path, matrix);
                    } else if (child.points) {
                        pts = child.points.map(p => fabric.util.transformPoint(p, matrix));
                    }
                    if (pts.length >= 3) results.push({ color: childColor, points: pts });
                });
            } else {
                const color = hexToNormalizedHex(obj.fill || '#000000');
                const bound = obj.getBoundingRect();
                const boxPoly = [
                    { x: bound.left, y: bound.top },
                    { x: bound.left + bound.width, y: bound.top },
                    { x: bound.left + bound.width, y: bound.top + bound.height },
                    { x: bound.left, y: bound.top + bound.height }
                ];
                results.push({ color: color, points: boxPoly });
            }
            return results;
        }

        function sampleFabricPath(pathCmds, matrix) {
            const pts = [];
            let curr = { x: 0, y: 0 };
            pathCmds.forEach(cmd => {
                const type = cmd[0];
                if (type === 'M' || type === 'L') {
                    curr = { x: cmd[1], y: cmd[2] };
                    pts.push(matrix ? fabric.util.transformPoint(curr, matrix) : { ...curr });
                } else if (type === 'C') {
                    for (let t = 0.25; t <= 1.0; t += 0.25) {
                        const x = Math.pow(1-t, 3)*curr.x + 3*Math.pow(1-t, 2)*t*cmd[1] + 3*(1-t)*t*t*cmd[3] + t*t*t*cmd[5];
                        const y = Math.pow(1-t, 3)*curr.y + 3*Math.pow(1-t, 2)*t*cmd[2] + 3*(1-t)*t*t*cmd[4] + t*t*t*cmd[6];
                        const p = { x, y };
                        pts.push(matrix ? fabric.util.transformPoint(p, matrix) : p);
                    }
                    curr = { x: cmd[5], y: cmd[6] };
                }
            });
            return pts;
        }

        function generateTatamiFill(polygon, pitch, angleRad, maxLen, pullComp) {
            const cosA = Math.cos(-angleRad), sinA = Math.sin(-angleRad);
            const cosBack = Math.cos(angleRad), sinBack = Math.sin(angleRad);

            const rotatedPoly = polygon.map(p => ({
                x: p.x * cosA - p.y * sinA,
                y: p.x * sinA + p.y * cosA
            }));

            let minY = Infinity, maxY = -Infinity;
            rotatedPoly.forEach(p => {
                if (p.y < minY) minY = p.y;
                if (p.y > maxY) maxY = p.y;
            });

            const fillPoints = [];
            let rowIndex = 0;

            for (let y = minY + pitch / 2; y < maxY; y += pitch) {
                const intersects = [];
                for (let i = 0; i < rotatedPoly.length; i++) {
                    const p1 = rotatedPoly[i];
                    const p2 = rotatedPoly[(i + 1) % rotatedPoly.length];

                    if ((p1.y <= y && p2.y > y) || (p2.y <= y && p1.y > y)) {
                        const x = p1.x + ((y - p1.y) / (p2.y - p1.y)) * (p2.x - p1.x);
                        intersects.push(x);
                    }
                }

                intersects.sort((a, b) => a - b);

                for (let k = 0; k < intersects.length - 1; k += 2) {
                    let x1 = intersects[k] - pullComp;
                    let x2 = intersects[k + 1] + pullComp;
                    const span = x2 - x1;

                    if (span > 0.5) {
                        const isEvenRow = rowIndex % 2 === 0;
                        const startX = isEvenRow ? x1 : x2;
                        const endX = isEvenRow ? x2 : x1;
                        const stepDir = isEvenRow ? 1 : -1;

                        const shiftOffset = ((rowIndex % 4) * 0.25) * maxLen * stepDir;
                        
                        let currentX = startX + shiftOffset;
                        if (isEvenRow && currentX < x1) currentX = x1;
                        if (!isEvenRow && currentX > x2) currentX = x2;

                        const linePts = [{ x: startX, y }];

                        while (isEvenRow ? currentX < endX : currentX > endX) {
                            linePts.push({ x: currentX, y });
                            currentX += maxLen * stepDir;
                        }
                        linePts.push({ x: endX, y });

                        linePts.forEach(pt => {
                            fillPoints.push({
                                x: pt.x * cosBack - pt.y * sinBack,
                                y: pt.x * sinBack + pt.y * cosBack
                            });
                        });
                    }
                }
                rowIndex++;
            }
            return fillPoints;
        }

        function resamplePolyline(poly, maxLen) {
            const res = [];
            for (let i = 0; i < poly.length; i++) {
                const p1 = poly[i];
                const p2 = poly[(i + 1) % poly.length];
                const dist = Math.hypot(p2.x - p1.x, p2.y - p1.y);
                res.push(p1);
                if (dist > maxLen) {
                    const steps = Math.floor(dist / maxLen);
                    for (let s = 1; s < steps; s++) {
                        res.push({
                            x: p1.x + (p2.x - p1.x) * (s / steps),
                            y: p1.y + (p2.y - p1.y) * (s / steps)
                        });
                    }
                }
            }
            return res;
        }

        function insetPolygon(poly, delta) {
            const center = poly.reduce((acc, p) => ({ x: acc.x + p.x/poly.length, y: acc.y + p.y/poly.length }), { x:0, y:0 });
            return poly.map(p => {
                const dirX = center.x - p.x;
                const dirY = center.y - p.y;
                const len = Math.hypot(dirX, dirY);
                if (len < delta) return p;
                return { x: p.x + (dirX/len)*delta, y: p.y + (dirY/len)*delta };
            });
        }

        function appendStitchSequence(targetStream, newStitches, trimThresholdPx, useLockStitches) {
            if (newStitches.length === 0) return;

            if (targetStream.length > 0) {
                const lastPt = targetStream[targetStream.length - 1];
                const startPt = newStitches[0];
                const gap = Math.hypot(startPt.x - lastPt.x, startPt.y - lastPt.y);

                if (gap > trimThresholdPx) {
                    if (useLockStitches) {
                        targetStream.push({ x: lastPt.x + 1, y: lastPt.y + 1 });
                        targetStream.push({ x: lastPt.x - 1, y: lastPt.y - 1 });
                    }
                    targetStream.push({ x: startPt.x, y: startPt.y, isJump: true });
                    if (useLockStitches) {
                        targetStream.push({ x: startPt.x + 1, y: startPt.y + 1 });
                        targetStream.push({ x: startPt.x - 1, y: startPt.y - 1 });
                    }
                }
            }
            newStitches.forEach(st => targetStream.push(st));
        }

        let previewActive = false;
        document.getElementById('toggle-preview-btn').addEventListener('click', () => {
            previewActive = !previewActive;

        function renderStitchPreview() {
            overlayCtx.clearRect(0, 0, overlayCanvas.width, overlayCanvas.height);
            overlayCtx.fillStyle = '#121212';
            overlayCtx.fillRect(0, 0, overlayCanvas.width, overlayCanvas.height);

            const { colorBlocks } = generateVectorStitches();

            colorBlocks.forEach(block => {
                const sts = block.stitches;
                if (sts.length < 2) return;

                overlayCtx.strokeStyle = 'rgba(0,0,0,0.6)';
                overlayCtx.lineWidth = 2.0;
                overlayCtx.beginPath();
                for (let i = 0; i < sts.length - 1; i++) {
                    if (!sts[i+1].isJump) {
                        overlayCtx.moveTo(sts[i].screenX + 1.2, sts[i].screenY + 1.2);
                        overlayCtx.lineTo(sts[i+1].screenX + 1.2, sts[i+1].screenY + 1.2);
                    }
                }
                overlayCtx.stroke();

                overlayCtx.strokeStyle = block.color;
                overlayCtx.lineWidth = 1.6;
                overlayCtx.lineCap = 'round';
                overlayCtx.beginPath();
                for (let i = 0; i < sts.length - 1; i++) {
                    if (!sts[i+1].isJump) {
                        overlayCtx.moveTo(sts[i].screenX, sts[i].screenY);
                        overlayCtx.lineTo(sts[i+1].screenX, sts[i+1].screenY);
                    }
                }
                overlayCtx.stroke();

                overlayCtx.strokeStyle = 'rgba(255, 0, 0, 0.4)';
                overlayCtx.lineWidth = 0.8;
                overlayCtx.setLineDash([3, 3]);
                overlayCtx.beginPath();
                for (let i = 0; i < sts.length - 1; i++) {
                    if (sts[i+1].isJump) {
                        overlayCtx.moveTo(sts[i].screenX, sts[i].screenY);
                        overlayCtx.lineTo(sts[i+1].screenX, sts[i+1].screenY);
                    }
                }
                overlayCtx.stroke();
                overlayCtx.setLineDash([]);
            });
        }

        const PEC_THREAD_PALETTE = [
            '#1a0a94','#0f75ff','#00934c','#babdfe','#ec0000','#e4995a','#cc48ab','#fdc4fa',
            '#dd84cd','#6bd38a','#e4a945','#ffbd42','#ffe600','#6cd900','#c1a941','#b5ad97',
            '#ba9c5f','#faf59e','#808080','#000000','#001cdf','#df00b8','#626262','#69260d',
            '#ff0060','#bf8200','#f39178','#ff6805','#f0f0f0','#c832cd','#b0bf9b','#65bfeb',
            '#ffba04','#fff06c','#feca15','#f38101','#37a923','#23465f','#a6a695','#cebfa6',
            '#96aa02','#ffe3c6','#ff99d7','#007004','#edccfb','#c089d8','#e7d9b4','#e90e86',
            '#cf6829','#408615','#db1797','#ffa704','#b9ffff','#228927','#b612cd','#00aa00',
            '#fea9dc','#fed510','#0097df','#ffff84','#cfe774','#ffc864','#ffc8c8','#ffc8c8'
        ];

        function findNearestPecColorIndex(hex) {
            const target = hexToRgb(hex);
            let bestIndex = 1, bestDist = Infinity;
            PEC_THREAD_PALETTE.forEach((swatchHex, i) => {
                const c = hexToRgb(swatchHex);
                const dist = (c.r - target.r) ** 2 + (c.g - target.g) ** 2 + (c.b - target.b) ** 2;
                if (dist < bestDist) { bestDist = dist; bestIndex = i + 1; }
            });
            return bestIndex;
        }

        document.getElementById('export-pes-btn').addEventListener('click', () => {
            const { colorBlocks } = generateVectorStitches();
            if (colorBlocks.length === 0) return alert("Add vector artwork or text to export.");

            const pesBytes = buildPesBinary(colorBlocks);
            const blob = new Blob([pesBytes], { type: "application/x-embroidery" });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = "vector_embroidery.pes";
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        });

        function writeU16LE(arr, offset, value) {
            arr[offset] = value & 0xFF;
            arr[offset + 1] = (value >> 8) & 0xFF;
        }
        function writeS16LE(arr, offset, value) {
            writeU16LE(arr, offset, value < 0 ? value + 0x10000 : value);
        }

        function buildPesBinary(colorBlocks) {
            const colorIndices = colorBlocks.map(b => findNearestPecColorIndex(b.color));
            const pecStitches = [];
            let lastX = 0, lastY = 0;
            let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;

            colorBlocks.forEach((block, bIdx) => {
                if (bIdx > 0) {
                    pecStitches.push(0xFE, 0xB0, colorIndices[bIdx]);
                }

                block.stitches.forEach((pt) => {
                    if (pt.x < minX) minX = pt.x;
                    if (pt.x > maxX) maxX = pt.x;
                    if (pt.y < minY) minY = pt.y;
                    if (pt.y > maxY) maxY = pt.y;

                    const dx = pt.x - lastX;
                    const dy = pt.y - lastY;
                    encodePecDelta(pecStitches, dx, dy, !!pt.isJump);
                    lastX = pt.x;
                    lastY = pt.y;
                });
            });

            pecStitches.push(0xFF);

            if (!isFinite(minX)) { minX = 0; maxX = 0; minY = 0; maxY = 0; }
            const designWidth = Math.max(0, Math.round(maxX - minX));
            const designHeight = Math.max(0, Math.round(maxY - minY));

            const pecHeader = new Uint8Array(512).fill(0x20);
            const label = ('LA:' + 'VECTOR_EMB').slice(0, 19).padEnd(19, ' ');
            for (let i = 0; i < 19; i++) pecHeader[i] = label.charCodeAt(i);
            pecHeader[19] = 0x0D; 

            pecHeader[31] = 0xFF;
            pecHeader[32] = 0xFF; 
            pecHeader[33] = 0x00;
            pecHeader[34] = 0x06; 
            pecHeader[35] = 0x26; 
            const unknown12 = [0x20, 0x20, 0x20, 0x20, 0x64, 0x20, 0x00, 0x20, 0x00, 0x20, 0x20, 0x20];
            for (let i = 0; i < 12; i++) pecHeader[36 + i] = unknown12[i];

            pecHeader[48] = colorBlocks.length - 1; 
            for (let i = 0; i < colorIndices.length; i++) {
                pecHeader[49 + i] = colorIndices[i];
            }

            const secondSection = new Uint8Array(20);
            const thumbnailOffset = 20 + pecStitches.length; 

            writeU16LE(secondSection, 0, 0x0000);
            writeU16LE(secondSection, 2, thumbnailOffset);
            writeU16LE(secondSection, 4, 0x0031);
            writeU16LE(secondSection, 6, 0xFFF0);
            writeS16LE(secondSection, 8, designWidth);
            writeS16LE(secondSection, 10, designHeight);
            writeU16LE(secondSection, 12, 0xE001);
            writeU16LE(secondSection, 14, 0xB001);

            const thumbWidthBytes = 6, thumbHeight = 38;
            const thumbSize = thumbWidthBytes * thumbHeight;
            const thumbnailCount = 1 + colorBlocks.length;
            const thumbnails = new Uint8Array(thumbSize * thumbnailCount); 

            const pecBlock = new Uint8Array(512 + 20 + pecStitches.length + thumbnails.length);
            pecBlock.set(pecHeader, 0);
            pecBlock.set(secondSection, 512);
            pecBlock.set(new Uint8Array(pecStitches), 532);
            pecBlock.set(thumbnails, 532 + pecStitches.length);

            const pecOffset = 0x200;
            const totalSize = pecOffset + pecBlock.length;
            const buffer = new Uint8Array(totalSize);

            const signature = "#PES0001";
            for (let i = 0; i < signature.length; i++) buffer[i] = signature.charCodeAt(i);

            buffer[0x08] = pecOffset & 0xFF;
            buffer[0x09] = (pecOffset >> 8) & 0xFF;
            buffer[0x0A] = (pecOffset >> 16) & 0xFF;
            buffer[0x0B] = (pecOffset >> 24) & 0xFF;

            buffer.set(pecBlock, pecOffset);
            return buffer;
        }

        function encodePecDelta(arr, dx, dy, isJump) {
            const needsLong = isJump || dx < -64 || dx > 63 || dy < -64 || dy > 63;
            const nibble = isJump ? 0x9 : 0x8;

            function pushCoord(v, useLongForm) {
                if (!useLongForm) {
                    arr.push(v & 0x7F); 
                } else {
                    const v12 = v & 0x0FFF; 
                    arr.push((nibble << 4) | ((v12 >> 8) & 0x0F), v12 & 0xFF);
                }
            }

            pushCoord(dx, needsLong);
            pushCoord(dy, needsLong);
        }

        function hexToRgb(hex) {
            const norm = hexToNormalizedHex(hex);
            const num = parseInt(norm.replace('#',''), 16);
            return { r: (num >> 16) & 255, g: (num >> 8) & 255, b: num & 255 };
        }

        function rgbToHex(r, g, b) {
            return '#' + [r, g, b].map(x => x.toString(16).padStart(2, '0')).join('');
        }

        function hexToNormalizedHex(hex) {
            if (!hex) return '#000000';
            if (hex.startsWith('rgb')) {
                const rgb = hex.match(/\d+/g);
                if (rgb) return rgbToHex(parseInt(rgb[0]), parseInt(rgb[1]), parseInt(rgb[2]));
            }
            let h = hex.replace('#', '');
            if (h.length === 3) h = h.split('').map(c => c + c).join('');
            return '#' + h;
        }

        updateHoopSize();
        saveCanvasState();
    </script>
