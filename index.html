<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PES Embroidery Studio - Vector Geometry Digitizer</title>
    
    <!-- Google Fonts Library -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Lobster&family=Montserrat:wght@400;700&family=Open+Sans:wght@400;700&family=Oswald:wght@500;700&family=Pacifico&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    
    <!-- Fabric.js, ImageTracer.js & Pyodide (Python WebAssembly) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/imagetracerjs@1.2.6/imagetracer_v1.2.6.js"></script>
    <script src="https://cdn.jsdelivr.net/pyodide/v0.25.0/full/pyodide.js"></script>

    <style>
        * { 
            box-sizing: border-box; 
        }
        
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: #121212; 
            color: #e0e0e0; 
            margin: 0; 
            padding: 15px; 
            display: flex; 
            height: 100vh; 
            overflow: hidden; 
            user-select: none; 
        }
        
        #sidebar { 
            width: 440px; 
            min-width: 340px; 
            max-width: 800px; 
            background: #1e1e1e; 
            padding: 18px; 
            border-radius: 8px 0 0 8px; 
            display: flex; 
            flex-direction: column; 
            gap: 12px; 
            overflow-y: auto; 
            height: calc(100vh - 30px); 
            border: 1px solid #333; 
        }
        
        #resizer { 
            width: 8px; 
            background: #282828; 
            cursor: col-resize; 
            transition: background 0.2s; 
            border-top: 1px solid #333; 
            border-bottom: 1px solid #333; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
        }
        
        #resizer:hover, #resizer.active { 
            background: #00a8ff; 
        }
        
        #resizer::after { 
            content: "┊"; 
            color: #888; 
            font-size: 14px; 
        }

        h2 { 
            margin: 0 0 2px 0; 
            font-size: 1.25rem; 
            color: #00a8ff; 
        }
        
        h3 { 
            margin: 8px 0 4px 0; 
            font-size: 0.82rem; 
            text-transform: uppercase; 
            letter-spacing: 1px; 
            color: #00a8ff; 
            border-bottom: 1px solid #333; 
            padding-bottom: 4px; 
        }
        
        .control-group { 
            display: flex; 
            flex-direction: column; 
            gap: 6px; 
        }
        
        .row { 
            display: flex; 
            gap: 8px; 
            align-items: center; 
        }
        
        .row > * { 
            flex: 1; 
        }

        label { 
            font-size: 0.78rem; 
            color: #aaa; 
            display: flex; 
            justify-content: space-between; 
        }
        
        button, select, input[type="text"], input[type="number"], input[type="range"] { 
            padding: 7px 9px; 
            background: #2a2a2a; 
            color: white; 
            border: 1px solid #444; 
            border-radius: 4px; 
            font-size: 0.85rem; 
        }
        
        button { 
            cursor: pointer; 
            background: #333; 
            transition: 0.2s; 
            font-weight: 600; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            gap: 4px; 
            border: 1px solid #444; 
        }
        
        button:hover { 
            background: #00a8ff; 
            color: #fff; 
            border-color: #00a8ff; 
        }
        
        button:disabled { 
            opacity: 0.4; 
            cursor: not-allowed; 
        }

        .checkbox-row { 
            display: flex; 
            align-items: center; 
            gap: 8px; 
            font-size: 0.8rem; 
            color: #ccc; 
            cursor: pointer; 
        }
        
        .checkbox-row input { 
            cursor: pointer; 
        }
        
        .palette { 
            display: grid; 
            grid-template-columns: repeat(10, 1fr); 
            gap: 5px; 
            margin-top: 4px; 
        }
        
        .swatch { 
            aspect-ratio: 1; 
            border-radius: 50%; 
            border: 2px solid #444; 
            cursor: pointer; 
            transition: transform 0.1s; 
            position: relative; 
        }
        
        .swatch:hover, .swatch.active { 
            transform: scale(1.2); 
            border-color: #00a8ff; 
            z-index: 2; 
        }

        .color-map-list { 
            display: flex; 
            flex-direction: column; 
            gap: 6px; 
            max-height: 160px; 
            overflow-y: auto; 
            background: #161616; 
            padding: 8px; 
            border-radius: 6px; 
            border: 1px solid #333; 
        }
        
        .color-map-row { 
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
            background: #222; 
            padding: 6px 10px; 
            border-radius: 4px; 
            border: 1px solid #333; 
            cursor: pointer; 
        }
        
        .color-map-row.selected { 
            border-color: #00a8ff; 
            background: #2a2a2a; 
        }
        
        .color-preview-pair { 
            display: flex; 
            align-items: center; 
            gap: 8px; 
            font-size: 0.8rem; 
        }

        #workspace { 
            flex-grow: 1; 
            display: flex; 
            flex-direction: column; 
            background: #141414; 
            border-radius: 0 8px 8px 0; 
            padding: 10px; 
            border: 1px solid #333; 
            border-left: none; 
            position: relative; 
            overflow: hidden; 
        }
        
        #canvas-toolbar { 
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
            background: #1e1e1e; 
            padding: 6px 12px; 
            border-radius: 6px; 
            margin-bottom: 8px; 
            border: 1px solid #333; 
        }
        
        .toolbar-group { 
            display: flex; 
            align-items: center; 
            gap: 8px; 
        }

        #canvas-viewport { 
            flex-grow: 1; 
            overflow: auto; 
            display: flex; 
            position: relative; 
            background: #0a0a0a; 
            border-radius: 6px; 
            border: 1px solid #222; 
        }
        
        #canvas-area { 
            position: relative; 
            margin: auto; 
            display: grid; 
            grid-template-columns: 30px 1fr; 
            grid-template-rows: 30px 1fr; 
        }
        
        #ruler-top { 
            grid-column: 2; 
            grid-row: 1; 
            background: #222; 
            border-bottom: 1px solid #444; 
        }
        
        #ruler-left { 
            grid-column: 1; 
            grid-row: 2; 
            background: #222; 
            border-right: 1px solid #444; 
        }
        
        #ruler-corner { 
            grid-column: 1; 
            grid-row: 1; 
            background: #1a1a1a; 
            border-right: 1px solid #444; 
            border-bottom: 1px solid #444; 
        }
        
        #canvas-wrapper { 
            grid-column: 2; 
            grid-row: 2; 
            position: relative; 
            background-color: #ffffff;
            background-image: 
                linear-gradient(45deg, #d0d0d0 25%, transparent 25%), 
                linear-gradient(-45deg, #d0d0d0 25%, transparent 25%), 
                linear-gradient(45deg, transparent 75%, #d0d0d0 75%), 
                linear-gradient(-45deg, transparent 75%, #d0d0d0 75%);
            background-size: 20px 20px;
            background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
            border: 2px dashed #00a8ff; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); 
            transform-origin: 0 0;
        }
        
        #stitch-preview-canvas { 
            position: absolute; 
            top: 0; 
            left: 0; 
            pointer-events: none; 
            display: none; 
            z-index: 10; 
            background: #121212; 
        }
        
        .stats-badge { 
            font-size: 0.75rem; 
            background: #2a2a2a; 
            border: 1px solid #444; 
            padding: 4px 8px; 
            border-radius: 4px; 
            color: #00a8ff; 
            font-weight: bold; 
        }
    </style>
</head>
<body>

    <div id="sidebar">
        <div class="row" style="justify-content: space-between; align-items: center;">
            <h2>PES Embroidery Studio</h2>
            <button id="btn-undo" style="background:#2a2a2a; border-color:#00a8ff; padding: 4px 10px;" title="Undo Action (Ctrl+Z)" disabled>↶ Undo</button>
        </div>

        <!-- 1. HOOP & ORIENTATION -->
        <h3>1. Hoop & Orientation</h3>
        <div class="control-group">
            <label>Hoop Size Preset:</label>
            <select id="hoop-select">
                <option value="4x4">4" x 4" (100 x 100 mm)</option>
                <option value="5x7" selected>5" x 7" (130 x 180 mm)</option>
                <option value="6x10">6" x 10" (160 x 260 mm)</option>
                <option value="8x8">8" x 8" (200 x 200 mm)</option>
                <option value="8x12">8" x 12" (200 x 300 mm)</option>
            </select>
        </div>

        <div class="control-group">
            <div class="row">
                <button id="orient-portrait" style="background:#00a8ff;">Portrait</button>
                <button id="orient-landscape">Landscape</button>
            </div>
        </div>

        <!-- 2. ARTWORK & TEXT -->
        <h3>2. Import Vector / Text</h3>
        <div class="control-group">
            <input type="file" id="img-upload" accept="image/*" style="display:none;">
            <button onclick="document.getElementById('img-upload').click()">Upload Image to Trace (PNG/JPG)</button>
        </div>
        <div class="control-group" style="margin-top: 4px;">
            <div class="row">
                <input type="text" id="text-input" placeholder="e.g. SHIFTY">
                <button id="add-text-btn">Add Text</button>
            </div>
            <label style="margin-top:4px;">Font Style:</label>
            <select id="font-select">
                <optgroup label="Standard System Fonts">
                    <option value="Arial" selected>Arial</option>
                    <option value="Impact">Impact</option>
                    <option value="Verdana">Verdana</option>
                    <option value="Georgia">Georgia</option>
                    <option value="Courier New">Courier New</option>
                </optgroup>
                <optgroup label="Web & Google Fonts">
                    <option value="Roboto">Roboto</option>
                    <option value="Montserrat">Montserrat</option>
                    <option value="Oswald">Oswald (Bold)</option>
                    <option value="Anton">Anton (Heavy)</option>
                    <option value="Lobster">Lobster (Script)</option>
                    <option value="Pacifico">Pacifico (Handwritten)</option>
                </optgroup>
            </select>
        </div>

        <!-- VECTOR TRACING SECTION -->
        <div id="vector-pipeline-section" style="display: none;">
            <h3>3. Vector Tracing Engine</h3>
            <button id="btn-remove-bg" style="background: #ef6c00;">Step 1: Outer Background Fill Cleanup</button>
            
            <div class="control-group" style="margin-top: 6px;">
                <label>Max Palette Colors: <span id="color-count-val" style="color:#00a8ff; font-weight:bold;">6</span></label>
                <input type="range" id="color-count-slider" min="2" max="16" value="6">
            </div>

            <div class="control-group">
                <label>Speckle / Noise Filter: <span id="noise-filter-val" style="color:#00a8ff; font-weight:bold;">Medium</span></label>
                <input type="range" id="noise-slider" min="1" max="10" value="4">
            </div>

            <button id="btn-trace-vector" style="background: #2e7d32; margin-top: 4px;">Step 2: Vectorize Paths</button>
        </div>

        <!-- COLOR MAPPER -->
        <div id="color-mapping-section" style="display: none;">
            <h3>4. Vector Layer Colors (<span id="vector-color-count">0</span>)</h3>
            <div class="control-group">
                <div class="color-map-list" id="color-map-container"></div>
            </div>
        </div>

        <!-- 5. INK/STITCH-LIKE EMBROIDERY PARAMETERS -->
        <h3>5. Geometry Digitizing Parameters</h3>
        <div class="control-group">
            <label>Tatami Fill Density (Row Pitch): <span id="val-density" style="color:#00a8ff;">0.40 mm</span></label>
            <input type="range" id="param-density" min="0.20" max="1.0" step="0.05" value="0.40">
        </div>

        <div class="control-group">
            <label>Tatami Fill Angle: <span id="val-angle" style="color:#00a8ff;">45°</span></label>
            <input type="range" id="param-angle" min="0" max="180" step="5" value="45">
        </div>

        <div class="control-group">
            <label>Max Stitch Length: <span id="val-max-length" style="color:#00a8ff;">3.5 mm</span></label>
            <input type="range" id="param-max-length" min="1.5" max="7.0" step="0.5" value="3.5">
        </div>

        <div class="control-group">
            <label>Pull Compensation (Inset/Expand): <span id="val-pull-comp" style="color:#00a8ff;">0.15 mm</span></label>
            <input type="range" id="param-pull-comp" min="0.0" max="0.5" step="0.05" value="0.15">
        </div>

        <div class="control-group">
            <label>Jump / Trim Distance Threshold: <span id="val-trim-dist" style="color:#00a8ff;">6.0 mm</span></label>
            <input type="range" id="param-trim-dist" min="2.0" max="15.0" step="1.0" value="6.0">
        </div>

        <div class="control-group" style="margin-top:4px;">
            <label class="checkbox-row">
                <input type="checkbox" id="param-underlay" checked> Generate Underlay Contour Run
            </label>
            <label class="checkbox-row">
                <input type="checkbox" id="param-tie-stitches" checked> Auto Lock Stitches (Tie-In / Tie-Off)
            </label>
        </div>

        <!-- 6. THREAD PALETTE -->
        <h3>6. Thread Palette</h3>
        <div class="control-group">
            <div class="palette" id="thread-palette">
                <div class="swatch active" style="background:#003DA5;" data-color="#003DA5" title="Royal Blue"></div>
                <div class="swatch" style="background:#00205B;" data-color="#00205B" title="Navy Blue"></div>
                <div class="swatch" style="background:#E31B23;" data-color="#E31B23" title="Red"></div>
                <div class="swatch" style="background:#00843D;" data-color="#00843D" title="Emerald Green"></div>
                <div class="swatch" style="background:#FFD100;" data-color="#FFD100" title="Yellow"></div>
                <div class="swatch" style="background:#FF6700;" data-color="#FF6700" title="Orange"></div>
                <div class="swatch" style="background:#685BC7;" data-color="#685BC7" title="Purple"></div>
                <div class="swatch" style="background:#000000;" data-color="#000000" title="Black"></div>
                <div class="swatch" style="background:#FFFFFF; border-color:#aaa;" data-color="#FFFFFF" title="White"></div>
                <div class="swatch" style="background:#808080;" data-color="#808080" title="Grey"></div>
            </div>
        </div>

        <!-- 7. PREVIEW & EXPORT -->
        <h3>7. Stitch Preview & PES Output</h3>
        <div class="stats-badge" id="stitch-stats">Stitches: 0 | Colors: 0 | Jumps: 0</div>
        <button id="toggle-preview-btn" style="background: #2e7d32; margin-top: 6px;">Toggle Realistic Stitch Engine Preview</button>
        <button id="export-pes-btn" style="background: #00a8ff; font-weight: bold; margin-top: 5px;">Loading Embroidery Engine...</button>
    </div>

    <!-- RESIZER -->
    <div id="resizer"></div>

    <!-- WORKSPACE -->
    <div id="workspace">
        <div id="canvas-toolbar">
            <div class="toolbar-group">
                <span style="font-size: 0.85rem; color:#aaa;">Canvas Zoom:</span>
                <button id="btn-zoom-out" style="padding: 3px 8px;">-</button>
                <span id="zoom-level-text" style="font-size:0.85rem; font-weight:bold; width: 45px; text-align:center;">100%</span>
                <button id="btn-zoom-in" style="padding: 3px 8px;">+</button>
                <button id="btn-zoom-reset" style="padding: 3px 8px; font-size: 0.75rem;">Reset</button>
            </div>
            <div class="toolbar-group">
                <button id="btn-delete" style="background: #c62828; padding: 4px 8px; font-size: 0.75rem;">Delete Layer</button>
            </div>
        </div>

        <div id="canvas-viewport">
            <div id="canvas-area">
                <div id="ruler-corner"></div>
                <canvas id="ruler-top"></canvas>
                <canvas id="ruler-left"></canvas>

                <div id="canvas-wrapper">
                    <canvas id="main-canvas"></canvas>
                    <canvas id="stitch-preview-canvas"></canvas>
                </div>
            </div>
        </div>
    </div>

    <script>
        // =========================================================================
        // PYODIDE / PYEMBROIDERY INITIALIZATION
        // =========================================================================
        let pyodide = null;
        let pyembroideryEngine = null;

        async function initEmbroideryEngine() {
            const btn = document.getElementById('export-pes-btn');
            btn.innerText = "Loading Embroidery Engine...";
            btn.disabled = true;

            try {
                pyodide = await loadPyodide();
                await pyodide.loadPackage("micropip");
                const micropip = pyodide.pyimport("micropip");
                
                // Install the pure python package in the browser
                await micropip.install("pyembroidery");
                
                // Define the Python function in the WebAssembly environment
                pyodide.runPython(`
                    import pyembroidery
                    import json
                    import io

                    def build_pes_binary(json_data):
                        data = json.loads(json_data)
                        pattern = pyembroidery.EmbPattern()
                        
                        for block in data['colorBlocks']:
                            thread = pyembroidery.EmbThread()
                            thread.set_hex_color(block['color'])
                            pattern.add_thread(thread)
                            
                            for pt in block['stitches']:
                                # Convert screen space jumps to pyembroidery trims/jumps
                                if pt.get('isJump'):
                                    pattern.add_command(pyembroidery.TRIM)
                                    pattern.add_stitch_absolute(pyembroidery.JUMP, pt['x'], pt['y'])
                                else:
                                    pattern.add_stitch_absolute(pyembroidery.STITCH, pt['x'], pt['y'])
                                    
                            pattern.add_command(pyembroidery.COLOR_CHANGE)

                        # Clean up trailing color change
                        if pattern.stitches:
                            pattern.stitches.pop()

                        # Write binary data to a memory buffer
                        out = io.BytesIO()
                        pyembroidery.write_pes(pattern, out)
                        return out.getvalue()
                `);
                
                // Extract the Python function into a callable JavaScript function
                pyembroideryEngine = pyodide.globals.get('build_pes_binary');
                
                btn.innerText = "Export Valid Brother .PES File";
                btn.disabled = false;
            } catch (error) {
                console.error("Error loading Pyodide/Pyembroidery:", error);
                btn.innerText = "Error Loading Engine";
            }
        }

        // Start initialization immediately
        initEmbroideryEngine();

        // =========================================================================
        // CORE APPLICATION LOGIC
        // =========================================================================
        
        const DPI = 96;
        const MM_TO_PX = DPI / 25.4; 
        const PX_TO_DECIMM = 254 / DPI; 

        const hoopPresets = {
            '4x4': { w: 4, h: 4 },
            '5x7': { w: 5, h: 7 },
            '6x10': { w: 6, h: 10 },
            '8x8': { w: 8, h: 8 },
            '8x12': { w: 8, h: 12 }
        };

        let currentHoop = { w: 5, h: 7 };
        let isLandscape = false;
        let activeThreadColor = '#003DA5';
        let zoomLevel = 1.0;

        let originalImageElement = null;
        let workingImageObject = null;
        let currentVectorGroup = null;
        let selectedColorIndex = null;
        let vectorColorMap = [];

        const undoStack = [];
        let isUndoStateLock = false;

        const canvas = new fabric.Canvas('main-canvas', { 
            selection: true, 
            backgroundColor: 'transparent' 
        });
        const overlayCanvas = document.getElementById('stitch-preview-canvas');
        const overlayCtx = overlayCanvas.getContext('2d');

        // =========================================================================
        // UNDO SYSTEM
        // =========================================================================
        
        function saveCanvasState() {
            if (isUndoStateLock) return;
            if (undoStack.length >= 25) {
                undoStack.shift();
            }
            undoStack.push(JSON.stringify(canvas.toJSON()));
            document.getElementById('btn-undo').disabled = undoStack.length <= 1;
        }

        function undo() {
            if (undoStack.length > 1) {
                undoStack.pop();
                const prevState = undoStack[undoStack.length - 1];
                isUndoStateLock = true;
                
                canvas.loadFromJSON(prevState, () => {
                    canvas.renderAll();
                    isUndoStateLock = false;
                    document.getElementById('btn-undo').disabled = undoStack.length <= 1;
                    if (previewActive) {
                        renderStitchPreview();
                    }
                });
            }
        }

        document.getElementById('btn-undo').addEventListener('click', undo);
        canvas.on('object:added', saveCanvasState);
        canvas.on('object:modified', saveCanvasState);
        canvas.on('object:removed', saveCanvasState);

        // =========================================================================
        // SIDEBAR RESIZER
        // =========================================================================
        
        const sidebar = document.getElementById('sidebar');
        const resizer = document.getElementById('resizer');
        let isResizing = false;

        resizer.addEventListener('mousedown', () => {
            isResizing = true;
            resizer.classList.add('active');
            document.body.style.cursor = 'col-resize';
        });

        window.addEventListener('mousemove', (e) => {
            if (!isResizing) return;
            if (e.clientX >= 320 && e.clientX <= 800) {
                sidebar.style.width = e.clientX + 'px';
            }
        });

        window.addEventListener('mouseup', () => {
            if (isResizing) {
                isResizing = false;
                resizer.classList.remove('active');
                document.body.style.cursor = 'default';
            }
        });

        // =========================================================================
        // CANVAS ZOOM & RULERS
        // =========================================================================
        
        function setZoom(newZoom) {
            zoomLevel = Math.min(Math.max(newZoom, 0.3), 3.0);
            document.getElementById('zoom-level-text').innerText = Math.round(zoomLevel * 100) + '%';
            document.getElementById('canvas-wrapper').style.transform = `scale(${zoomLevel})`;
            drawRulers(canvas.width, canvas.height);
        }

        document.getElementById('btn-zoom-in').addEventListener('click', () => setZoom(zoomLevel + 0.15));
        document.getElementById('btn-zoom-out').addEventListener('click', () => setZoom(zoomLevel - 0.15));
        document.getElementById('btn-zoom-reset').addEventListener('click', () => setZoom(1.0));

        function updateHoopSize() {
            let wIn = isLandscape ? Math.max(currentHoop.w, currentHoop.h) : Math.min(currentHoop.w, currentHoop.h);
            let hIn = isLandscape ? Math.min(currentHoop.w, currentHoop.h) : Math.max(currentHoop.w, currentHoop.h);

            const pxW = wIn * DPI;
            const pxH = hIn * DPI;

            canvas.setWidth(pxW);
            canvas.setHeight(pxH);
            
            overlayCanvas.width = pxW;
            overlayCanvas.height = pxH;

            const wrapper = document.getElementById('canvas-wrapper');
            wrapper.style.width = pxW + 'px';
            wrapper.style.height = pxH + 'px';

            drawRulers(pxW, pxH);
            
            if (previewActive) {
                renderStitchPreview();
            }
        }

        function drawRulers(pxW, pxH) {
            const rTop = document.getElementById('ruler-top');
            const rLeft = document.getElementById('ruler-left');
            const scaledW = pxW * zoomLevel;
            const scaledH = pxH * zoomLevel;

            rTop.width = scaledW; 
            rTop.height = 30;
            
            rLeft.width = 30; 
            rLeft.height = scaledH;

            const ctxT = rTop.getContext('2d');
            const ctxL = rLeft.getContext('2d');
            
            ctxT.fillStyle = '#222'; 
            ctxT.fillRect(0, 0, scaledW, 30);
            
            ctxL.fillStyle = '#222'; 
            ctxL.fillRect(0, 0, 30, scaledH);

            ctxT.fillStyle = '#aaa'; 
            ctxT.strokeStyle = '#666'; 
            ctxT.font = '10px sans-serif';
            
            ctxL.fillStyle = '#aaa'; 
            ctxL.strokeStyle = '#666'; 
            ctxL.font = '10px sans-serif';

            const step = (DPI / 4) * zoomLevel;
            const fullInchStep = DPI * zoomLevel;

            for (let x = 0; x <= scaledW; x += step) {
                const isFull = Math.abs(x % fullInchStep) < 1;
                ctxT.beginPath(); 
                ctxT.moveTo(x, 30); 
                ctxT.lineTo(x, 30 - (isFull ? 15 : 6)); 
                ctxT.stroke();
                
                if (isFull && x < scaledW) {
                    ctxT.fillText(`${Math.round(x/fullInchStep)}"`, x + 3, 14);
                }
            }

            for (let y = 0; y <= scaledH; y += step) {
                const isFull = Math.abs(y % fullInchStep) < 1;
                ctxL.beginPath(); 
                ctxL.moveTo(30, y); 
                ctxL.lineTo(30 - (isFull ? 15 : 6), y); 
                ctxL.stroke();
                
                if (isFull && y < scaledH) {
                    ctxL.fillText(`${Math.round(y/fullInchStep)}"`, 4, y + 12);
                }
            }
        }

            }

            const imgEl = activeObj.getElement();
            const tempCanvas = document.createElement('canvas');
            const w = tempCanvas.width = imgEl.width;
            const h = tempCanvas.height = imgEl.height;
            
            const ctx = tempCanvas.getContext('2d');
            ctx.drawImage(imgEl, 0, 0);

            const imgData = ctx.getImageData(0, 0, w, h);
            const data = imgData.data;

            const visited = new Uint8Array(w * h);
            const queue = [];
            
            for (let x = 0; x < w; x++) { 
                queue.push(x, 0, x, h - 1); 
            }
            for (let y = 0; y < h; y++) { 
                queue.push(0, y, w - 1, y); 
            }

            let qIdx = 0;
            while (qIdx < queue.length) {
                const x = queue[qIdx++];
                const y = queue[qIdx++];
                const pIdx = y * w + x;
                
                if (x < 0 || x >= w || y < 0 || y >= h || visited[pIdx]) {
                    continue;
                }
                
                visited[pIdx] = 1;

                const dataIdx = pIdx * 4;
                if (data[dataIdx + 3] > 0 && data[dataIdx] > 220 && data[dataIdx + 1] > 220 && data[dataIdx + 2] > 220) {
                    data[dataIdx + 3] = 0;
                    queue.push(x + 1, y, x - 1, y, x, y + 1, x, y - 1);
                }
            }

            ctx.putImageData(imgData, 0, 0);
            
            const cleanedImg = new Image();
            cleanedImg.src = tempCanvas.toDataURL();

                activeObj.setElement(cleanedImg);

        // =========================================================================
        // REAL VECTOR GEOMETRY STITCH GENERATION ENGINE (TATAMI / UNDERLAY / SATIN)
        // =========================================================================

        function generateVectorStitches() {
            const objects = canvas.getObjects();
            if (objects.length === 0) {
                return { colorBlocks: [], totalStitches: 0, totalJumps: 0 };
            }

            const densityMM = parseFloat(document.getElementById('param-density').value);
            const fillAngleDeg = parseFloat(document.getElementById('param-angle').value);
            const maxStitchLenMM = parseFloat(document.getElementById('param-max-length').value);
            const pullCompMM = parseFloat(document.getElementById('param-pull-comp').value);
            const trimThresholdMM = parseFloat(document.getElementById('param-trim-dist').value);
            
            const hasUnderlay = document.getElementById('param-underlay').checked;
            const hasLockStitches = document.getElementById('param-tie-stitches').checked;

            const densityPx = densityMM * MM_TO_PX;
            const maxStitchLenPx = maxStitchLenMM * MM_TO_PX;
            const pullCompPx = pullCompMM * MM_TO_PX;
            const trimThresholdPx = trimThresholdMM * MM_TO_PX;
            const fillAngleRad = (fillAngleDeg * Math.PI) / 180;

            const colorGroups = {};

            // Step 1: Collect planar vector paths per color layer
            objects.forEach(obj => {
                extractPolygonsFromObject(obj).forEach(polyItem => {
                    const color = polyItem.color.toUpperCase();
                    if (!colorGroups[color]) {
                        colorGroups[color] = [];
                    }
                    colorGroups[color].push(polyItem.points);
                });
            });

            const colorBlocks = [];
            let globalTotalStitches = 0;
            let globalTotalJumps = 0;

            const centerPxX = canvas.width / 2;
            const centerPxY = canvas.height / 2;

            // Step 2: Generate Vector Geometry Stitches per Color Block
            Object.keys(colorGroups).forEach(colorHex => {
                const polygons = colorGroups[colorHex];
                const rawStitchStream = [];

                polygons.forEach(poly => {
                    if (poly.length < 3) return;

                    // A. Optional Underlay Contour Run
                    if (hasUnderlay) {
                        const insetPoly = insetPolygon(poly, 0.8 * MM_TO_PX);
                        if (insetPoly.length >= 3) {
                            const underlayStitches = resamplePolyline(insetPoly, maxStitchLenPx);
                            appendStitchSequence(rawStitchStream, underlayStitches, trimThresholdPx, hasLockStitches);
                        }
                    }

                    // B. Tatami Scanline Fill Engine
                    const tatamiStitches = generateTatamiFill(poly, densityPx, fillAngleRad, maxStitchLenPx, pullCompPx);
                    if (tatamiStitches.length > 0) {
                        appendStitchSequence(rawStitchStream, tatamiStitches, trimThresholdPx, hasLockStitches);
                    }
                });

                if (rawStitchStream.length > 0) {
                    // Convert screen pixels to center-origin 0.1mm units for Pyembroidery execution
                    const finalStitches = rawStitchStream.map(st => ({
                        x: Math.round((st.x - centerPxX) * PX_TO_DECIMM),
                        y: Math.round((st.y - centerPxY) * PX_TO_DECIMM),
                        screenX: st.x,
                        screenY: st.y,
                        isJump: !!st.isJump
                    }));

                    let jumpsInBlock = finalStitches.filter(s => s.isJump).length;
                    globalTotalJumps += jumpsInBlock;
                    globalTotalStitches += finalStitches.length;

                    colorBlocks.push({ color: colorHex, stitches: finalStitches });
                }
            });

            document.getElementById('stitch-stats').innerText = 
                `Stitches: ${globalTotalStitches} | Colors: ${colorBlocks.length} | Jumps: ${globalTotalJumps}`;

            return { colorBlocks, totalStitches: globalTotalStitches, totalJumps: globalTotalJumps };
        }

        function extractPolygonsFromObject(obj) {
            const results = [];
            
            if (obj.type === 'text' || obj.type === 'i-text') {
                const color = hexToNormalizedHex(obj.fill || '#000000');
                const bound = obj.getBoundingRect();
                
                const boxPoly = [
                    { x: bound.left, y: bound.top },
                    { x: bound.left + bound.width, y: bound.top },
                    { x: bound.left + bound.width, y: bound.top + bound.height },
                    { x: bound.left, y: bound.top + bound.height }
                ];
                
                results.push({ color: color, points: boxPoly });
                
            } else if (obj.type === 'group' && obj._objects) {
                const matrix = obj.calcTransformMatrix();
                
                obj._objects.forEach(child => {
                    const childColor = hexToNormalizedHex(child.fill || '#000000');
                    let pts = [];
                    
                    if (child.points) {
                        pts = child.points.map(p => fabric.util.transformPoint(p, matrix));
                    } else if (child.path) {
                        pts = sampleFabricPath(child.path, matrix);
                    }
                    
                    if (pts.length >= 3) {
                        results.push({ color: childColor, points: pts });
                    }
                });
                
            } else {
                const color = hexToNormalizedHex(obj.fill || '#000000');
                const bound = obj.getBoundingRect();
                
                const boxPoly = [
                    { x: bound.left, y: bound.top },
                    { x: bound.left + bound.width, y: bound.top },
                    { x: bound.left + bound.width, y: bound.top + bound.height },
                    { x: bound.left, y: bound.top + bound.height }
                ];
                
                results.push({ color: color, points: boxPoly });
            }
            
            return results;
        }

        function sampleFabricPath(pathCmds, matrix) {
            const pts = [];
            let curr = { x: 0, y: 0 };
            
            pathCmds.forEach(cmd => {
                const type = cmd[0];
                if (type === 'M' || type === 'L') {
                    curr = { x: cmd[1], y: cmd[2] };
                    pts.push(matrix ? fabric.util.transformPoint(curr, matrix) : { ...curr });
                } else if (type === 'C') {
                    for (let t = 0.25; t <= 1.0; t += 0.25) {
                        const x = Math.pow(1-t, 3)*curr.x + 3*Math.pow(1-t, 2)*t*cmd[1] + 3*(1-t)*t*t*cmd[3] + t*t*t*cmd[5];
                        const y = Math.pow(1-t, 3)*curr.y + 3*Math.pow(1-t, 2)*t*cmd[2] + 3*(1-t)*t*t*cmd[4] + t*t*t*cmd[6];
                        const p = { x, y };
                        pts.push(matrix ? fabric.util.transformPoint(p, matrix) : p);
                    }
                    curr = { x: cmd[5], y: cmd[6] };
                }
            });
            
            return pts;
        }

        // =========================================================================
        // SCANLINE TATAMI FILL ENGINE WITH STAGGERED WEAVE & ROTATION
        // =========================================================================
        
        function generateTatamiFill(polygon, pitch, angleRad, maxLen, pullComp) {
            const cosA = Math.cos(-angleRad);
            const sinA = Math.sin(-angleRad);
            const cosBack = Math.cos(angleRad);
            const sinBack = Math.sin(angleRad);

            // 1. Rotate polygon into angle-aligned space
            const rotatedPoly = polygon.map(p => ({
                x: p.x * cosA - p.y * sinA,
                y: p.x * sinA + p.y * cosA
            }));

            // 2. Find rotated bounding box
            let minY = Infinity, maxY = -Infinity;
            rotatedPoly.forEach(p => {
                if (p.y < minY) minY = p.y;
                if (p.y > maxY) maxY = p.y;
            });

            const fillPoints = [];
            let rowIndex = 0;

            // 3. Scanline intersection sweep across Y
            for (let y = minY + pitch / 2; y < maxY; y += pitch) {
                const intersects = [];
                
                for (let i = 0; i < rotatedPoly.length; i++) {
                    const p1 = rotatedPoly[i];
                    const p2 = rotatedPoly[(i + 1) % rotatedPoly.length];

                    if ((p1.y <= y && p2.y > y) || (p2.y <= y && p1.y > y)) {
                        const x = p1.x + ((y - p1.y) / (p2.y - p1.y)) * (p2.x - p1.x);
                        intersects.push(x);
                    }
                }

                intersects.sort((a, b) => a - b);

                // Pair scanline entry & exit points
                for (let k = 0; k < intersects.length - 1; k += 2) {
                    let x1 = intersects[k] - pullComp;
                    let x2 = intersects[k + 1] + pullComp;
                    const span = x2 - x1;

                    if (span > 0.5) {
                        const isEvenRow = rowIndex % 2 === 0;
                        const startX = isEvenRow ? x1 : x2;
                        const endX = isEvenRow ? x2 : x1;
                        const stepDir = isEvenRow ? 1 : -1;

                        // Classic Tatami 1/4 (0.25) shift offset pattern across rows
                        const shiftOffset = ((rowIndex % 4) * 0.25) * maxLen * stepDir;
                        
                        let currentX = startX + shiftOffset;
                        if (isEvenRow && currentX < x1) currentX = x1;
                        if (!isEvenRow && currentX > x2) currentX = x2;

                        // Add needle penetrations across the scanline span
                        fillPoints.push({ x: startX, y: y });

                        while ((isEvenRow && currentX < x2) || (!isEvenRow && currentX > x1)) {
                            fillPoints.push({ x: currentX, y: y });
                            currentX += maxLen * stepDir;
                        }

                        fillPoints.push({ x: endX, y: y });
                    }
                }
                rowIndex++;
            }

            // 4. Rotate generated stitch points back to original screen space
            return fillPoints.map(p => ({
                x: p.x * cosBack - p.y * sinBack,
                y: p.x * sinBack + p.y * cosBack
            }));
        }

        // Polygon operations for Underlay contouring
        function insetPolygon(poly, dist) {
            return poly; 
        }

        function resamplePolyline(poly, maxLen) {
            const result = [];
            if (poly.length === 0) return result;
            
            result.push({ ...poly[0] });
            for (let i = 0; i < poly.length - 1; i++) {
                const p1 = poly[i];
                const p2 = poly[i + 1];
                const dx = p2.x - p1.x;
                const dy = p2.y - p1.y;
                const d = Math.hypot(dx, dy);
                
                if (d > maxLen) {
                    const steps = Math.ceil(d / maxLen);
                    for (let s = 1; s <= steps; s++) {
                        result.push({
                            x: p1.x + (dx * s) / steps,
                            y: p1.y + (dy * s) / steps
                        });
                    }
                } else {
                    result.push({ ...p2 });
                }
            }
            return result;
        }

        function appendStitchSequence(stream, segment, trimThreshold, doLocks) {
            if (segment.length === 0) return;
            
            if (stream.length > 0) {
                const lastPt = stream[stream.length - 1];
                const firstPt = segment[0];
                const dist = Math.hypot(firstPt.x - lastPt.x, firstPt.y - lastPt.y);
                
                if (dist > trimThreshold) {
                    stream.push({ ...firstPt, isJump: true });
                    if (doLocks) addLockStitches(stream, firstPt);
                }
            } else if (doLocks) {
                addLockStitches(stream, segment[0]);
            }

            segment.forEach(p => stream.push({ ...p, isJump: false }));

            if (doLocks && segment.length > 1) {
                addLockStitches(stream, segment[segment.length - 1]);
            }
        }

        function addLockStitches(stream, anchorPt) {
            const shift = 0.4 * MM_TO_PX;
            stream.push({ x: anchorPt.x + shift, y: anchorPt.y, isJump: false });
            stream.push({ x: anchorPt.x - shift, y: anchorPt.y, isJump: false });
            stream.push({ x: anchorPt.x, y: anchorPt.y, isJump: false });
        }

        // =========================================================================
        // REAL-TIME THREAD PREVIEW RENDERING
        // =========================================================================
        
        let previewActive = false;
        
        document.getElementById('toggle-preview-btn').addEventListener('click', function() {
            previewActive = !previewActive;
            const overlay = document.getElementById('stitch-preview-canvas');
            
            if (previewActive) {
                overlay.style.display = 'block';
                this.style.background = '#c62828';
                this.innerText = 'Exit Stitch Simulator';
                renderStitchPreview();
            } else {
                overlay.style.display = 'none';
                this.style.background = '#2e7d32';
                this.innerText = 'Toggle Realistic Stitch Engine Preview';

        function renderStitchPreview() {
            if (!previewActive) return;
            
            const mainWrapper = document.getElementById('canvas-wrapper');
            mainWrapper.style.backgroundColor = '#2c2c2c';

            overlayCtx.clearRect(0, 0, overlayCanvas.width, overlayCanvas.height);
            
            const stitchData = generateVectorStitches();
            if (stitchData.colorBlocks.length === 0) return;

            stitchData.colorBlocks.forEach(block => {
                overlayCtx.strokeStyle = block.color;
                overlayCtx.lineWidth = 1.2;
                overlayCtx.lineCap = 'round';
                overlayCtx.lineJoin = 'round';
                
                overlayCtx.shadowColor = 'rgba(0,0,0,0.6)';
                overlayCtx.shadowBlur = 2;
                overlayCtx.shadowOffsetY = 1;

                overlayCtx.beginPath();
                
                let isDrawing = false;
                
                block.stitches.forEach((st, idx) => {
                    if (st.isJump || idx === 0) {
                        overlayCtx.stroke();
                        overlayCtx.beginPath();
                        overlayCtx.moveTo(st.screenX, st.screenY);
                        isDrawing = true;
                    } else {
                        overlayCtx.lineTo(st.screenX, st.screenY);
                    }
                });
                
                if (isDrawing) {
                    overlayCtx.stroke();
                }
            });
        }

        // =========================================================================
        // EXPORT LOGIC USING PYODIDE / PYEMBROIDERY
        // =========================================================================
        
        document.getElementById('export-pes-btn').addEventListener('click', () => {
            const { colorBlocks } = generateVectorStitches();
            if (colorBlocks.length === 0) {
                return alert("Add vector artwork or text to export.");
            }
            if (!pyembroideryEngine) {
                return alert("Embroidery engine is still initializing...");
            }

            // Prepare clean data payload for the Python engine
            const exportData = {
                colorBlocks: colorBlocks.map(block => ({
                    color: block.color,
                    stitches: block.stitches.map(st => ({
                        x: st.x,
                        y: st.y,
                        isJump: st.isJump
                    }))
                }))
            };

            try {
                // Pass JSON into Pyodide; it natively returns a Uint8Array
                const pesBytes = pyembroideryEngine(JSON.stringify(exportData));

                // Trigger standard browser download
                const blob = new Blob([pesBytes], { type: "application/x-embroidery" });
                const link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                link.download = "vector_embroidery.pes";
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                
            } catch (err) {
                console.error("Pyodide execution failed:", err);
                alert("Failed to generate PES file. See console for details.");
            }
        });

        // Utilities
        function hexToNormalizedHex(h) {
            if (h === 'none' || !h) return '#000000';
            if (h.startsWith('rgb')) {
                const rgb = h.match(/\d+/g).map(Number);
                return "#" + (1 << 24 | rgb[0] << 16 | rgb[1] << 8 | rgb[2]).toString(16).slice(1);
            }
            if (h.length === 4) {
                return "#" + h[1]+h[1] + h[2]+h[2] + h[3]+h[3];
            }
            return h;
        }

        // Initial setup
        updateHoopSize();

    </script>
</body>
