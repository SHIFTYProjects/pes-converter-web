<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PES Embroidery Studio</title>
    <!-- Fabric.js for interactive canvas design -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #121212; color: #e0e0e0; margin: 0; padding: 20px; display: flex; gap: 20px; height: 100vh; overflow: hidden; }
        
        /* Sidebar Controls */
        #sidebar { width: 350px; background: #1e1e1e; padding: 20px; border-radius: 8px; display: flex; flex-direction: column; gap: 15px; overflow-y: auto; max-height: calc(100vh - 40px); border: 1px solid #333; }
        h2 { margin: 0 0 5px 0; font-size: 1.3rem; color: #00a8ff; }
        h3 { margin: 10px 0 5px 0; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 1px; color: #888; border-bottom: 1px solid #333; padding-bottom: 4px; }
        
        .control-group { display: flex; flex-direction: column; gap: 6px; }
        .row { display: flex; gap: 10px; align-items: center; }
        .row > * { flex: 1; }

        label { font-size: 0.85rem; color: #aaa; }
        button, select, input[type="text"], input[type="number"] { padding: 8px 10px; background: #2a2a2a; color: white; border: 1px solid #444; border-radius: 4px; font-size: 0.9rem; }
        button { cursor: pointer; background: #333; transition: 0.2s; font-weight: 600; }
        button:hover { background: #00a8ff; color: #fff; border-color: #00a8ff; }
        
        /* Swatches */
        .palette { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 5px; }
        .swatch { width: 28px; height: 28px; border-radius: 50%; border: 2px solid #444; cursor: pointer; transition: 0.1s; position: relative; }
        .swatch:hover, .swatch.active { transform: scale(1.15); border-color: #00a8ff; }
        .swatch.selected-extracted { border-color: #FFD100; box-shadow: 0 0 8px #FFD100; }

        /* Workspace Area & Rulers */
        #workspace { flex-grow: 1; display: flex; flex-direction: column; background: #181818; border-radius: 8px; padding: 10px; border: 1px solid #333; position: relative; overflow: auto; }
        #canvas-area { position: relative; margin: auto; display: grid; grid-template-columns: 30px 1fr; grid-template-rows: 30px 1fr; }
        
        #ruler-top { grid-column: 2; grid-row: 1; background: #222; border-bottom: 1px solid #444; }
        #ruler-left { grid-column: 1; grid-row: 2; background: #222; border-right: 1px solid #444; }
        #ruler-corner { grid-column: 1; grid-row: 1; background: #1a1a1a; border-right: 1px solid #444; border-bottom: 1px solid #444; }
        
        #canvas-wrapper { grid-column: 2; grid-row: 2; position: relative; background: #f0f0f0; border: 2px dashed #00a8ff; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        #stitch-preview-canvas { position: absolute; top: 0; left: 0; pointer-events: none; display: none; z-index: 10; background: #1a1a1a; }
    </style>
</head>
<body>

    <!-- SIDEBAR CONTROL PANEL -->
    <div id="sidebar">
        <h2>PES Studio</h2>

        <!-- HOOP CONFIGURATION -->
        <h3>1. Hoop & Orientation</h3>
        <div class="control-group">
            <label>Hoop Size Preset:</label>
            <select id="hoop-select">
                <option value="4x4">4" x 4" (100 x 100 mm)</option>
                <option value="5x7" selected>5" x 7" (130 x 180 mm)</option>
                <option value="6x10">6" x 10" (160 x 260 mm)</option>
                <option value="8x8">8" x 8" (200 x 200 mm)</option>
                <option value="8x12">8" x 12" (200 x 300 mm)</option>
                <option value="9.5x14">9.5" x 14" (240 x 360 mm)</option>
                <option value="custom">Custom Size...</option>
            </select>
        </div>

        <div id="custom-hoop-inputs" class="row" style="display: none;">
            <div>
                <label>Width (in):</label>
                <input type="number" id="custom-w" value="6" step="0.5" min="1">
            </div>
            <div>
                <label>Height (in):</label>
                <input type="number" id="custom-h" value="6" step="0.5" min="1">
            </div>
        </div>

        <div class="control-group">
            <label>Orientation:</label>
            <div class="row">
                <button id="orient-portrait" style="background:#00a8ff;">Portrait</button>
                <button id="orient-landscape">Landscape</button>
            </div>
        </div>

        <!-- ARTWORK & TEXT -->
        <h3>2. Add Objects</h3>
        <div class="control-group">
            <input type="file" id="img-upload" accept="image/*" style="display:none;">
            <button onclick="document.getElementById('img-upload').click()">Upload Graphic (PNG/JPG)</button>
        </div>
        <div class="control-group" style="margin-top: 5px;">
            <div class="row">
                <input type="text" id="text-input" placeholder="e.g. SHIFTY">
                <button id="add-text-btn">Add Text</button>
            </div>
            <select id="font-select">
                <option value="Arial">Arial</option>
                <option value="Impact">Impact</option>
                <option value="Courier New">Courier New</option>
                <option value="Trebuchet MS">Trebuchet MS</option>
                <option value="Georgia">Georgia</option>
            </select>
        </div>

        <!-- IMAGE COLOR EXTRACTION & RECOLORING -->
        <div id="image-colors-section" style="display: none;">
            <h3>Extracted Image Colors</h3>
            <label>Click an image color below to replace it:</label>
            <div class="palette" id="extracted-palette"></div>
            <div class="row" style="margin-top: 8px;">
                <button id="btn-recolor-apply" style="background:#00a8ff; display:none;">Swap Color</button>
            </div>
        </div>

        <!-- OBJECT PROPERTIES & LAYERS -->
        <h3>3. Selected Object Controls</h3>
        <div class="control-group">
            <label>Dimensions (Inches):</label>
            <div class="row">
                <div>
                    <label>W:</label>
                    <input type="number" id="obj-w" step="0.1" disabled>
                </div>
                <div>
                    <label>H:</label>
                    <input type="number" id="obj-h" step="0.1" disabled>
                </div>
            </div>
            <div class="row" style="margin-top: 4px;">
                <label><input type="checkbox" id="aspect-lock" checked> Lock Aspect Ratio</label>
            </div>
        </div>

        <div class="control-group">
            <label>Layer Order & Actions:</label>
            <div class="row">
                <button id="btn-front">Bring to Front</button>
                <button id="btn-back">Send to Back</button>
            </div>
            <button id="btn-delete" style="background: #c62828; margin-top: 4px;">Delete Selected (Del)</button>
        </div>

        <!-- THREAD COLORS -->
        <h3>4. Thread Color Palette</h3>
        <div class="control-group">
            <div class="palette" id="thread-palette">
                <div class="swatch active" style="background:#003DA5;" data-color="#003DA5" title="Royal Blue"></div>
                <div class="swatch" style="background:#00205B;" data-color="#00205B" title="Navy"></div>
                <div class="swatch" style="background:#E31B23;" data-color="#E31B23" title="Red"></div>
                <div class="swatch" style="background:#00843D;" data-color="#00843D" title="Emerald Green"></div>
                <div class="swatch" style="background:#FFD100;" data-color="#FFD100" title="Yellow"></div>
                <div class="swatch" style="background:#FF6700;" data-color="#FF6700" title="Orange"></div>
                <div class="swatch" style="background:#685BC7;" data-color="#685BC7" title="Purple"></div>
                <div class="swatch" style="background:#000000;" data-color="#000000" title="Black"></div>
                <div class="swatch" style="background:#FFFFFF; border-color:#aaa;" data-color="#FFFFFF" title="White"></div>
            </div>
            <div class="row" style="margin-top: 8px;">
                <label>Custom Thread Color:</label>
                <input type="color" id="custom-thread-color" value="#003DA5">
            </div>
        </div>

        <!-- PREVIEW & EXPORT -->
        <h3>5. Output & Simulation</h3>
        <button id="toggle-preview-btn" style="background: #2e7d32;">Toggle Realistic Stitch Preview</button>
        <button id="export-pes-btn" style="background: #00a8ff; font-weight: bold; margin-top: 5px;">Export .PES File</button>
    </div>

    <!-- MAIN WORKSPACE / CANVAS AREA -->
    <div id="workspace">
        <div id="canvas-area">
            <div id="ruler-corner"></div>
            <canvas id="ruler-top"></canvas>
            <canvas id="ruler-left"></canvas>

            <div id="canvas-wrapper">
                <canvas id="main-canvas"></canvas>
                <canvas id="stitch-preview-canvas"></canvas>
            </div>
        </div>
    </div>

    <script>
        const DPI = 96; // 96 pixels = 1 inch
        
        const hoopPresets = {
            '4x4': { w: 4, h: 4 },
            '5x7': { w: 5, h: 7 },
            '6x10': { w: 6, h: 10 },
            '8x8': { w: 8, h: 8 },
            '8x12': { w: 8, h: 12 },
            '9.5x14': { w: 9.5, h: 14 }
        };

        let currentHoop = { w: 5, h: 7 };
        let isLandscape = false;
        let activeThreadColor = '#003DA5';
        let selectedExtractedColor = null;

        const canvas = new fabric.Canvas('main-canvas', { selection: true });
        const overlayCanvas = document.getElementById('stitch-preview-canvas');
        const overlayCtx = overlayCanvas.getContext('2d');

        // Hoop Setup
        function updateHoopSize() {
            let widthInches = currentHoop.w;
            let heightInches = currentHoop.h;

            if (isLandscape) {
                [widthInches, heightInches] = [Math.max(widthInches, heightInches), Math.min(widthInches, heightInches)];
            } else {
                [widthInches, heightInches] = [Math.min(widthInches, heightInches), Math.max(widthInches, heightInches)];
            }

            const pxW = widthInches * DPI;
            const pxH = heightInches * DPI;

            canvas.setWidth(pxW);
            canvas.setHeight(pxH);
            overlayCanvas.width = pxW;
            overlayCanvas.height = pxH;

            const wrapper = document.getElementById('canvas-wrapper');
            wrapper.style.width = pxW + 'px';
            wrapper.style.height = pxH + 'px';

            drawRulers(pxW, pxH);
        }

        function drawRulers(pxW, pxH) {
            const rTop = document.getElementById('ruler-top');
            const rLeft = document.getElementById('ruler-left');
            rTop.width = pxW; rTop.height = 30;
            rLeft.width = 30; rLeft.height = pxH;

            const ctxT = rTop.getContext('2d');
            const ctxL = rLeft.getContext('2d');

            ctxT.fillStyle = '#222'; ctxT.fillRect(0,0,pxW,30);
            ctxL.fillStyle = '#222'; ctxL.fillRect(0,0,30,pxH);

            ctxT.fillStyle = '#aaa'; ctxT.strokeStyle = '#666'; ctxT.font = '10px sans-serif';
            ctxL.fillStyle = '#aaa'; ctxL.strokeStyle = '#666'; ctxL.font = '10px sans-serif';

            for (let x = 0; x <= pxW; x += DPI / 4) {
                const isFullInch = x % DPI === 0;
                const tickH = isFullInch ? 15 : (x % (DPI/2) === 0 ? 10 : 5);
                ctxT.beginPath(); ctxT.moveTo(x, 30); ctxT.lineTo(x, 30 - tickH); ctxT.stroke();
                if (isFullInch && x < pxW) ctxT.fillText(`${Math.round(x/DPI)}"`, x + 3, 14);
            }

            for (let y = 0; y <= pxH; y += DPI / 4) {
                const isFullInch = y % DPI === 0;
                const tickW = isFullInch ? 15 : (y % (DPI/2) === 0 ? 10 : 5);
                ctxL.beginPath(); ctxL.moveTo(30, y); ctxL.lineTo(30 - tickW, y); ctxL.stroke();
                if (isFullInch && y < pxH) ctxL.fillText(`${Math.round(y/DPI)}"`, 4, y + 12);
            }
        }

        // Hoop Controls
        document.getElementById('hoop-select').addEventListener('change', (e) => {
            const val = e.target.value;
            const customBox = document.getElementById('custom-hoop-inputs');
            if (val === 'custom') {
                customBox.style.display = 'flex';
                currentHoop = { w: parseFloat(document.getElementById('custom-w').value), h: parseFloat(document.getElementById('custom-h').value) };
            } else {
                customBox.style.display = 'none';
                currentHoop = { ...hoopPresets[val] };
            }
            updateHoopSize();
        });

        // Orientation
        document.getElementById('orient-portrait').addEventListener('click', function() {
            isLandscape = false;
            this.style.background = '#00a8ff';
            document.getElementById('orient-landscape').style.background = '#333';
            updateHoopSize();
        });

        document.getElementById('orient-landscape').addEventListener('click', function() {
            isLandscape = true;
            this.style.background = '#00a8ff';
            document.getElementById('orient-portrait').style.background = '#333';
            updateHoopSize();
        });

        // IMAGE UPLOAD & COLOR EXTRACTION
        document.getElementById('img-upload').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(f) {
                const imgObj = new Image();
                imgObj.src = f.target.result;
                imgObj.onload = function() {
                    const fabricImg = new fabric.Image(imgObj);
                    fabricImg.scaleToWidth(2.5 * DPI);
                    fabricImg.set({ left: 40, top: 40 });
                    
                    // Save original canvas element for pixel color swapping
                    const origCanvas = document.createElement('canvas');
                    origCanvas.width = imgObj.width;
                    origCanvas.height = imgObj.height;
                    const oCtx = origCanvas.getContext('2d');
                    oCtx.drawImage(imgObj, 0, 0);
                    fabricImg.originalCanvas = origCanvas;

                    canvas.add(fabricImg);
                    canvas.setActiveObject(fabricImg);
                    
                    extractColorsFromImage(fabricImg);
                };
            };
            reader.readAsDataURL(file);
        });

        // Extract Color Palette from Image
        function extractColorsFromImage(fabricImg) {
            const origCanvas = fabricImg.originalCanvas;
            if (!origCanvas) return;
            const ctx = origCanvas.getContext('2d');
            const imgData = ctx.getImageData(0, 0, origCanvas.width, origCanvas.height).data;
            
            const colorCounts = {};
            for (let i = 0; i < imgData.length; i += 16) { // Sample pixels
                const a = imgData[i + 3];
                if (a < 128) continue; // Ignore transparent pixels
                
                // Quantize RGB to 32-step buckets
                const r = Math.round(imgData[i] / 32) * 32;
                const g = Math.round(imgData[i+1] / 32) * 32;
                const b = Math.round(imgData[i+2] / 32) * 32;
                const hex = `#${((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1)}`;
                
                colorCounts[hex] = (colorCounts[hex] || 0) + 1;
            }

            const sortedColors = Object.keys(colorCounts).sort((a,b) => colorCounts[b] - colorCounts[a]).slice(0, 6);
            const container = document.getElementById('extracted-palette');
            container.innerHTML = '';

            sortedColors.forEach((hex, idx) => {
                const swatch = document.createElement('div');
                swatch.className = 'swatch' + (idx === 0 ? ' selected-extracted' : '');
                swatch.style.background = hex;
                swatch.dataset.color = hex;
                swatch.title = `Extracted Color: ${hex}`;
                
                swatch.addEventListener('click', function() {
                    document.querySelectorAll('#extracted-palette .swatch').forEach(s => s.classList.remove('selected-extracted'));
                    this.classList.add('selected-extracted');
                    selectedExtractedColor = hex;
                });
                
                container.appendChild(swatch);
            });

            selectedExtractedColor = sortedColors[0] || null;
            document.getElementById('image-colors-section').style.display = 'block';
        }

        // Swap Color in Image
        function recolorActiveImage(targetHex, replacementHex) {
            const active = canvas.getActiveObject();
            if (!active || active.type !== 'image' || !active.originalCanvas) return;

            const origCanvas = active.originalCanvas;
            const ctx = origCanvas.getContext('2d');
            const imgData = ctx.getImageData(0, 0, origCanvas.width, origCanvas.height);
            const data = imgData.data;

            const targetRgb = hexToRgb(targetHex);
            const replacementRgb = hexToRgb(replacementHex);

            for (let i = 0; i < data.length; i += 4) {
                if (data[i + 3] < 128) continue;

                // Color Euclidean Distance
                const dr = data[i] - targetRgb.r;
                const dg = data[i+1] - targetRgb.g;
                const db = data[i+2] - targetRgb.b;
                const dist = Math.sqrt(dr*dr + dg*dg + db*db);

                if (dist < 60) { // Color match threshold
                    data[i] = replacementRgb.r;
                    data[i+1] = replacementRgb.g;
                    data[i+2] = replacementRgb.b;
                }
            }

            ctx.putImageData(imgData, 0, 0);

            // Update Fabric Image element source
            const newImg = new Image();
            newImg.src = origCanvas.toDataURL();
            newImg.onload = function() {
                active.setElement(newImg);
                canvas.renderAll();
                extractColorsFromImage(active); // Refresh palette UI
                if (previewActive) renderStitchPreview();
            };
        }

        function hexToRgb(hex) {
            const num = parseInt(hex.replace('#',''), 16);
            return { r: (num >> 16) & 255, g: (num >> 8) & 255, b: num & 255 };
        }

        // Add Text
        document.getElementById('add-text-btn').addEventListener('click', () => {
            const textVal = document.getElementById('text-input').value || 'SHIFTY';
            const fontFamily = document.getElementById('font-select').value;

            const text = new fabric.Text(textVal, {
                left: 50, top: 50,
                fontFamily: fontFamily,
                fill: activeThreadColor,
                fontSize: 48
            });
            canvas.add(text);
            canvas.setActiveObject(text);
        });

        // Layer Controls & Deletion
        document.getElementById('btn-front').addEventListener('click', () => {
            const active = canvas.getActiveObject();
            if (active) { canvas.bringToFront(active); canvas.renderAll(); }
        });

        document.getElementById('btn-back').addEventListener('click', () => {
            const active = canvas.getActiveObject();
            if (active) { canvas.sendToBack(active); canvas.renderAll(); }
        });

        function deleteActiveObjects() {
            const activeObjects = canvas.getActiveObjects();
            if (activeObjects.length > 0) {
                activeObjects.forEach(obj => canvas.remove(obj));
                canvas.discardActiveObject();
                canvas.renderAll();
                updateObjectInputs();
                document.getElementById('image-colors-section').style.display = 'none';
            }
        }

        document.getElementById('btn-delete').addEventListener('click', deleteActiveObjects);

        window.addEventListener('keydown', (e) => {
            if ((e.key === 'Delete' || e.key === 'Backspace') && 
                !['INPUT', 'SELECT', 'TEXTAREA'].includes(document.activeElement.tagName)) {
                deleteActiveObjects();
            }
        });

        // Object Dimensions Readout
        function updateObjectInputs() {
            const active = canvas.getActiveObject();
            const wInput = document.getElementById('obj-w');
            const hInput = document.getElementById('obj-h');

            if (active) {
                wInput.disabled = false; hInput.disabled = false;
                wInput.value = (active.getBoundingRect().width / DPI).toFixed(2);
                hInput.value = (active.getBoundingRect().height / DPI).toFixed(2);
                
                if (active.type === 'image') {
                    extractColorsFromImage(active);
                } else {
                    document.getElementById('image-colors-section').style.display = 'none';
                }
            } else {
                wInput.disabled = true; hInput.disabled = true;
                wInput.value = ''; hInput.value = '';
                document.getElementById('image-colors-section').style.display = 'none';
            }
        }

        canvas.on('selection:created', updateObjectInputs);
        canvas.on('selection:updated', updateObjectInputs);
        canvas.on('selection:cleared', updateObjectInputs);
        canvas.on('object:modified', updateObjectInputs);

        // Thread Palette Swatches
        document.querySelectorAll('#thread-palette .swatch').forEach(swatch => {
            swatch.addEventListener('click', function() {
                document.querySelectorAll('#thread-palette .swatch').forEach(s => s.classList.remove('active'));
                this.classList.add('active');
                activeThreadColor = this.dataset.color;
                applyThreadColor(activeThreadColor);
            });
        });

        document.getElementById('custom-thread-color').addEventListener('input', function() {
            activeThreadColor = this.value;
            applyThreadColor(activeThreadColor);
        });

        function applyThreadColor(color) {
            const active = canvas.getActiveObject();
            if (!active) return;

            if (active.type === 'image') {
                if (selectedExtractedColor) {
                    recolorActiveImage(selectedExtractedColor, color);
                }
            } else {
                active.set('fill', color);
                canvas.renderAll();
                if (previewActive) renderStitchPreview();
            }
        }

        // REAL EMBROIDERY TATAMI & SATIN STITCH GENERATOR
        function generateEmbroideryStitches() {
            const objects = canvas.getObjects();
            if (objects.length === 0) return [];

            const pxToDeciMM = 254 / DPI; // Converts pixels to 0.1mm units
            const centerPxX = canvas.width / 2;
            const centerPxY = canvas.height / 2;

            const colorBlocks = [];

            objects.forEach(obj => {
                // Render object onto separate temp canvas to analyze shapes
                const tempCanvas = document.createElement('canvas');
                tempCanvas.width = canvas.width;
                tempCanvas.height = canvas.height;
                const tCtx = tempCanvas.getContext('2d');

                const staticCanvas = new fabric.StaticCanvas(null, { width: canvas.width, height: canvas.height });
                staticCanvas.add(obj);
                staticCanvas.renderAll();
                tCtx.drawImage(staticCanvas.getElement(), 0, 0);

                const imgData = tCtx.getImageData(0, 0, canvas.width, canvas.height);
                const data = imgData.data;

                // Unique color extraction per object
                const uniqueColors = {};
                for (let i = 0; i < data.length; i += 16) {
                    if (data[i + 3] > 128) {
                        const hex = `#${((1 << 24) + (data[i] << 16) + (data[i+1] << 8) + data[i+2]).toString(16).slice(1)}`;
                        uniqueColors[hex] = true;
                    }
                }

                Object.keys(uniqueColors).forEach(colorHex => {
                    const stitches = [];
                    const targetRgb = hexToRgb(colorHex);

                    // Create Bounding Box
                    let minX = canvas.width, maxX = 0, minY = canvas.height, maxY = 0;
                    for (let y = 0; y < canvas.height; y += 2) {
                        for (let x = 0; x < canvas.width; x += 2) {
                            const idx = (y * canvas.width + x) * 4;
                            if (data[idx + 3] > 128) {
                                const dr = Math.abs(data[idx] - targetRgb.r);
                                const dg = Math.abs(data[idx+1] - targetRgb.g);
                                const db = Math.abs(data[idx+2] - targetRgb.b);
                                if (dr + dg + db < 50) {
                                    if (x < minX) minX = x;
                                    if (x > maxX) maxX = x;
                                    if (y < minY) minY = y;
                                    if (y > maxY) maxY = y;
                                }
                            }
                        }
                    }

                    if (minX >= maxX || minY >= maxY) return;

                    // 1. TATAMI ANGLED FILL STITCHES (45 Degree Staggered Grid)
                    const rowSpacing = 3.5; // ~0.4mm stitch density spacing
                    const maxStitchLen = 12; // ~3.5mm max stitch segment length
                    let rowIndex = 0;

                    for (let y = minY; y <= maxY; y += rowSpacing) {
                        const isEven = rowIndex % 2 === 0;
                        const xStart = isEven ? minX : maxX;
                        const xEnd = isEven ? maxX : minX;
                        const xStep = isEven ? 2 : -2;

                        let inSegment = false;
                        let lineStart = null;
                        let segmentPoints = [];

                        for (let x = xStart; isEven ? x <= xEnd : x >= xEnd; x += xStep) {
                            const idx = (Math.floor(y) * canvas.width + Math.floor(x)) * 4;
                            const isMatch = data[idx + 3] > 128 && 
                                           (Math.abs(data[idx] - targetRgb.r) + 
                                            Math.abs(data[idx+1] - targetRgb.g) + 
                                            Math.abs(data[idx+2] - targetRgb.b)) < 50;

                            if (isMatch) {
                                if (!inSegment) {
                                    inSegment = true;
                                    lineStart = { x, y };
                                    segmentPoints.push(lineStart);
                                } else {
                                    const lastPt = segmentPoints[segmentPoints.length - 1];
                                    const dist = Math.hypot(x - lastPt.x, y - lastPt.y);
                                    // Add staggered Tatami penetration points
                                    const offset = (rowIndex % 3) * (maxStitchLen / 3);
                                    if (dist >= (maxStitchLen + offset)) {
                                        segmentPoints.push({ x, y });
                                    }
                                }
                            } else {
                                if (inSegment) {
                                    segmentPoints.push({ x: x - xStep, y });
                                    inSegment = false;
                                    // Convert points to 0.1mm coordinates
                                    segmentPoints.forEach(pt => {
                                        stitches.push({
                                            x: Math.round((pt.x - centerPxX) * pxToDeciMM),
                                            y: Math.round((pt.y - centerPxY) * pxToDeciMM),
                                            screenX: pt.x,
                                            screenY: pt.y
                                        });
                                    });
                                    segmentPoints = [];
                                }
                            }
                        }
                        rowIndex++;
                    }

                    if (stitches.length > 0) {
                        colorBlocks.push({ color: colorHex, stitches: stitches });
                    }
                });
            });

            return colorBlocks;
        }

        // REALISTIC 3D THREAD PREVIEW RENDERER
        let previewActive = false;
        document.getElementById('toggle-preview-btn').addEventListener('click', () => {
            previewActive = !previewActive;
            overlayCanvas.style.display = previewActive ? 'block' : 'none';
            if (previewActive) renderStitchPreview();
        });

        function renderStitchPreview() {
            overlayCtx.clearRect(0, 0, overlayCanvas.width, overlayCanvas.height);
            
            // Draw Fabric Texture Background
            overlayCtx.fillStyle = '#1e1e1e';
            overlayCtx.fillRect(0, 0, overlayCanvas.width, overlayCanvas.height);

            const blocks = generateEmbroideryStitches();

            blocks.forEach(block => {
                const stitches = block.stitches;
                if (stitches.length < 2) return;

                // Pass 1: Thread Shadow for Depth
                overlayCtx.strokeStyle = 'rgba(0,0,0,0.6)';
                overlayCtx.lineWidth = 2.5;
                overlayCtx.beginPath();
                for (let i = 0; i < stitches.length - 1; i++) {
                    const p1 = stitches[i];
                    const p2 = stitches[i+1];
                    if (Math.hypot(p2.screenX - p1.screenX, p2.screenY - p1.screenY) < 20) {
                        overlayCtx.moveTo(p1.screenX + 1, p1.screenY + 1.5);
                        overlayCtx.lineTo(p2.screenX + 1, p2.screenY + 1.5);
                    }
                }
                overlayCtx.stroke();

                // Pass 2: Main Thread Color Strand
                overlayCtx.strokeStyle = block.color;
                overlayCtx.lineWidth = 1.8;
                overlayCtx.lineCap = 'round';
                overlayCtx.beginPath();
                for (let i = 0; i < stitches.length - 1; i++) {
                    const p1 = stitches[i];
                    const p2 = stitches[i+1];
                    if (Math.hypot(p2.screenX - p1.screenX, p2.screenY - p1.screenY) < 20) {
                        overlayCtx.moveTo(p1.screenX, p1.screenY);
                        overlayCtx.lineTo(p2.screenX, p2.screenY);
                    }
                }
                overlayCtx.stroke();

                // Pass 3: Thread Sheen & Needle Punctures
                overlayCtx.strokeStyle = 'rgba(255,255,255,0.25)';
                overlayCtx.lineWidth = 0.6;
                overlayCtx.beginPath();
                for (let i = 0; i < stitches.length - 1; i++) {
                    const p1 = stitches[i];
                    const p2 = stitches[i+1];
                    if (Math.hypot(p2.screenX - p1.screenX, p2.screenY - p1.screenY) < 20) {
                        overlayCtx.moveTo(p1.screenX - 0.3, p1.screenY - 0.3);
                        overlayCtx.lineTo(p2.screenX - 0.3, p2.screenY - 0.3);
                    }
                }
                overlayCtx.stroke();

                // Needle Hole Points
                overlayCtx.fillStyle = '#0d0d0d';
                stitches.forEach(pt => {
                    overlayCtx.beginPath();
                    overlayCtx.arc(pt.screenX, pt.screenY, 0.8, 0, Math.PI * 2);
                    overlayCtx.fill();
                });
            });
        }

        // BINARY BROTHER .PES ENCODER
        document.getElementById('export-pes-btn').addEventListener('click', () => {
            const blocks = generateEmbroideryStitches();
            if (blocks.length === 0) {
                alert("Please add artwork or text to export.");
                return;
            }

            const pesBytes = buildPesBinary(blocks);
            const blob = new Blob([pesBytes], { type: "application/x-embroidery" });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = "embroidered_design.pes";
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        });

        function buildPesBinary(blocks) {
            const pecStitches = [];
            let lastX = 0, lastY = 0;

            blocks.forEach((block, bIdx) => {
                if (bIdx > 0) {
                    pecStitches.push(0xFE, 0xB0, (bIdx % 8) + 1); // Color Change
                }

                block.stitches.forEach((pt, pIdx) => {
                    let dx = pt.x - lastX;
                    let dy = pt.y - lastY;
                    let isJump = pIdx === 0 || Math.abs(dx) > 110 || Math.abs(dy) > 110;

                    encodePecDelta(pecStitches, dx, dy, isJump);
                    lastX = pt.x;
                    lastY = pt.y;
                });
            });

            pecStitches.push(0xFF, 0x00); // End of pattern

            const pecHeader = new Uint8Array(512);
            const label = "LA:SHIFTY        ";
            for (let i = 0; i < label.length; i++) pecHeader[i] = label.charCodeAt(i);
            pecHeader[0x0D] = 0x30;
            pecHeader[0x1D] = blocks.length;

            blocks.forEach((b, i) => { pecHeader[0x1E + i] = (i % 8) + 1; });

            const pecOffset = 0x200;
            const totalSize = pecOffset + pecHeader.length + pecStitches.length;
            const buffer = new Uint8Array(totalSize);

            const signature = "#PES0001";
            for (let i = 0; i < signature.length; i++) buffer[i] = signature.charCodeAt(i);

            buffer[0x08] = pecOffset & 0xFF;
            buffer[0x09] = (pecOffset >> 8) & 0xFF;
            buffer[0x0A] = (pecOffset >> 16) & 0xFF;
            buffer[0x0B] = (pecOffset >> 24) & 0xFF;

            buffer.set(pecHeader, pecOffset);
            buffer.set(new Uint8Array(pecStitches), pecOffset + pecHeader.length);

            return buffer;
        }

        function encodePecDelta(arr, dx, dy, isJump) {
            function encodeVal(v, jump) {
                if (!jump && v >= -64 && v <= 63) {
                    arr.push(v & 0x7F);
                } else {
                    let code = v & 0x0FFF;
                    if (jump) code |= 0x1000;
                    code |= 0x8000;
                    arr.push((code >> 8) & 0xFF, code & 0xFF);
                }
            }
            encodeVal(dx, isJump);
            encodeVal(dy, isJump);
        }

        updateHoopSize();
    </script>
